<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>VOID DRIFTER - Space Pirate Oregon Trail</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #000;
  overflow: hidden;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  font-family: monospace;
}
canvas {
  display: block;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  touch-action: none;
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
}
#scanlines {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: repeating-linear-gradient(
    0deg,
    rgba(0,0,0,0.1) 0px,
    rgba(0,0,0,0.1) 1px,
    transparent 1px,
    transparent 3px
  );
  pointer-events: none;
  z-index: 20;
}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="scanlines"></div>
<script>
// ============================================================
// VOID DRIFTER - A Space Pirate Oregon Trail
// Survive the endless void. No destination. No end.
// ============================================================

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

// --- CONSTANTS ---
const W = 800, H = 600;
let SCALE = 1;

function resize() {
  SCALE = Math.min(window.innerWidth / W, window.innerHeight / H);
  canvas.width = W;
  canvas.height = H;
  canvas.style.width = (W * SCALE) + 'px';
  canvas.style.height = (H * SCALE) + 'px';
}
window.addEventListener('resize', resize);
resize();

// --- COLOR PALETTE ---
const PAL = {
  bg: '#0a0a1a',
  panel: '#111827',
  panelBorder: '#1e3a5f',
  panelLight: '#1a2744',
  text: '#c8d6e5',
  textDim: '#5a6a7a',
  textBright: '#ffffff',
  accent: '#00ffcc',
  accentDim: '#007766',
  warning: '#ff6644',
  danger: '#ff2244',
  gold: '#ffcc00',
  goldDim: '#aa8800',
  fuel: '#44aaff',
  food: '#66cc44',
  hull: '#888899',
  morale: '#cc66ff',
  oxygen: '#44dddd',
  ammo: '#ff8844',
  parts: '#aaaacc',
  reputation: '#ffaa00',
  credits: '#ffcc00',
  space: '#060612',
  starA: '#ffffff',
  starB: '#aaccff',
  starC: '#ffccaa',
  pirate: '#ff4466',
  friendly: '#44ff88',
  neutral: '#8888aa',
};

// --- INPUT ---
const mouse = { x: 0, y: 0, clicked: false, down: false };
const keys = {};

canvas.addEventListener('mousemove', e => {
  const r = canvas.getBoundingClientRect();
  mouse.x = (e.clientX - r.left) / SCALE;
  mouse.y = (e.clientY - r.top) / SCALE;
});
canvas.addEventListener('mousedown', e => { mouse.down = true; });
canvas.addEventListener('mouseup', e => { mouse.down = false; });
canvas.addEventListener('click', e => {
  const r = canvas.getBoundingClientRect();
  mouse.x = (e.clientX - r.left) / SCALE;
  mouse.y = (e.clientY - r.top) / SCALE;
  mouse.clicked = true;
});

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  const t = e.changedTouches[0];
  const r = canvas.getBoundingClientRect();
  mouse.x = (t.clientX - r.left) / SCALE;
  mouse.y = (t.clientY - r.top) / SCALE;
  mouse.clicked = true;
  mouse.down = true;
}, { passive: false });
canvas.addEventListener('touchend', e => {
  mouse.down = false;
}, { passive: false });
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  const t = e.changedTouches[0];
  const r = canvas.getBoundingClientRect();
  mouse.x = (t.clientX - r.left) / SCALE;
  mouse.y = (t.clientY - r.top) / SCALE;
}, { passive: false });

window.addEventListener('keydown', e => {
  keys[e.code] = true;
  // Keyboard shortcuts for buttons: 1-9 selects visible (non-tab) button by index, Enter selects first
  if (gameState !== STATE.COMBAT) {
    const actionButtons = buttons.filter(b => b.style !== 'tab');
    const num = parseInt(e.key);
    if (num >= 1 && num <= actionButtons.length) {
      Audio.play('click');
      actionButtons[num - 1].action();
      return;
    }
    if (e.code === 'Enter' && actionButtons.length > 0) {
      Audio.play('click');
      actionButtons[0].action();
    }
  }
});
window.addEventListener('keyup', e => { keys[e.code] = false; });
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

// --- AUDIO ENGINE ---
const Audio = {
  ctx: null,
  master: null,
  initialized: false,

  init() {
    if (this.initialized) return;
    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    this.master = this.ctx.createGain();
    this.master.gain.value = 0.3;
    this.master.connect(this.ctx.destination);
    this.initialized = true;
  },

  play(type) {
    if (!this.initialized) return;
    const t = this.ctx.currentTime;
    switch(type) {
      case 'click': {
        const o = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        o.type = 'sine';
        o.frequency.setValueAtTime(800, t);
        o.frequency.exponentialRampToValueAtTime(1200, t + 0.05);
        g.gain.setValueAtTime(0.15, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.08);
        o.connect(g); g.connect(this.master);
        o.start(t); o.stop(t + 0.1);
        break;
      }
      case 'hover': {
        const o = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        o.type = 'sine';
        o.frequency.value = 600;
        g.gain.setValueAtTime(0.05, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
        o.connect(g); g.connect(this.master);
        o.start(t); o.stop(t + 0.06);
        break;
      }
      case 'good': {
        [0, 0.08, 0.16].forEach((d, i) => {
          const o = this.ctx.createOscillator();
          const g = this.ctx.createGain();
          o.type = 'sine';
          o.frequency.value = 400 + i * 200;
          g.gain.setValueAtTime(0.12, t + d);
          g.gain.exponentialRampToValueAtTime(0.001, t + d + 0.1);
          o.connect(g); g.connect(this.master);
          o.start(t + d); o.stop(t + d + 0.12);
        });
        break;
      }
      case 'bad': {
        const o = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        o.type = 'sawtooth';
        o.frequency.setValueAtTime(200, t);
        o.frequency.exponentialRampToValueAtTime(80, t + 0.3);
        g.gain.setValueAtTime(0.2, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
        o.connect(g); g.connect(this.master);
        o.start(t); o.stop(t + 0.35);
        break;
      }
      case 'alarm': {
        for (let i = 0; i < 3; i++) {
          const o = this.ctx.createOscillator();
          const g = this.ctx.createGain();
          o.type = 'square';
          o.frequency.setValueAtTime(800, t + i * 0.15);
          o.frequency.setValueAtTime(600, t + i * 0.15 + 0.07);
          g.gain.setValueAtTime(0.1, t + i * 0.15);
          g.gain.exponentialRampToValueAtTime(0.001, t + i * 0.15 + 0.12);
          o.connect(g); g.connect(this.master);
          o.start(t + i * 0.15); o.stop(t + i * 0.15 + 0.14);
        }
        break;
      }
      case 'travel': {
        const o = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        o.type = 'triangle';
        o.frequency.setValueAtTime(100, t);
        o.frequency.linearRampToValueAtTime(200, t + 1);
        g.gain.setValueAtTime(0.08, t);
        g.gain.setValueAtTime(0.08, t + 0.8);
        g.gain.exponentialRampToValueAtTime(0.001, t + 1.2);
        o.connect(g); g.connect(this.master);
        o.start(t); o.stop(t + 1.3);
        break;
      }
      case 'shoot': {
        const o = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        o.type = 'square';
        o.frequency.setValueAtTime(900, t);
        o.frequency.exponentialRampToValueAtTime(200, t + 0.08);
        g.gain.setValueAtTime(0.15, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.08);
        o.connect(g); g.connect(this.master);
        o.start(t); o.stop(t + 0.1);
        break;
      }
      case 'explode': {
        const sz = this.ctx.sampleRate * 0.3;
        const buf = this.ctx.createBuffer(1, sz, this.ctx.sampleRate);
        const d = buf.getChannelData(0);
        for (let i = 0; i < sz; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / sz);
        const s = this.ctx.createBufferSource();
        s.buffer = buf;
        const g = this.ctx.createGain();
        const f = this.ctx.createBiquadFilter();
        f.type = 'lowpass';
        f.frequency.setValueAtTime(2000, t);
        f.frequency.exponentialRampToValueAtTime(100, t + 0.3);
        g.gain.setValueAtTime(0.3, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
        s.connect(f); f.connect(g); g.connect(this.master);
        s.start(t);
        break;
      }
      case 'death': {
        const o = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        o.type = 'sawtooth';
        o.frequency.setValueAtTime(400, t);
        o.frequency.exponentialRampToValueAtTime(30, t + 1.5);
        g.gain.setValueAtTime(0.25, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 1.5);
        o.connect(g); g.connect(this.master);
        o.start(t); o.stop(t + 1.6);
        break;
      }
    }
  },

  ambience(intensity) {
    if (!this.initialized) return;
    // Ambient drone - called periodically
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator();
    const o2 = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    const f = this.ctx.createBiquadFilter();
    o.type = 'sine';
    o2.type = 'sine';
    o.frequency.value = 55 + intensity * 20;
    o2.frequency.value = 55.5 + intensity * 20;
    f.type = 'lowpass';
    f.frequency.value = 200;
    g.gain.setValueAtTime(0.04, t);
    g.gain.setValueAtTime(0.04, t + 3);
    g.gain.exponentialRampToValueAtTime(0.001, t + 4);
    o.connect(f); o2.connect(f); f.connect(g); g.connect(this.master);
    o.start(t); o2.start(t);
    o.stop(t + 4.1); o2.stop(t + 4.1);
  }
};

// --- STAR BACKGROUND ---
const bgStars = [];
for (let i = 0; i < 200; i++) {
  bgStars.push({
    x: Math.random() * W,
    y: Math.random() * H,
    size: Math.random() < 0.1 ? 2 : 1,
    brightness: Math.random() * 0.6 + 0.2,
    color: [PAL.starA, PAL.starB, PAL.starC][Math.floor(Math.random() * 3)],
    twinkleSpeed: Math.random() * 3 + 1,
  });
}

function drawStarfield(scroll) {
  bgStars.forEach(s => {
    const y = (s.y + (scroll || 0) * s.size * 0.1) % H;
    const tw = Math.sin(gameTime * s.twinkleSpeed + s.x) * 0.2;
    ctx.globalAlpha = Math.max(0.05, s.brightness + tw);
    ctx.fillStyle = s.color;
    ctx.fillRect(s.x, y, s.size, s.size);
  });
  ctx.globalAlpha = 1;
}

// --- ENHANCED BACKGROUND ELEMENTS ---

// Parallax nebula clouds - large transparent colored blobs that drift slowly
const bgNebulae = [];
for (let i = 0; i < 6; i++) {
  bgNebulae.push({
    x: Math.random() * W,
    y: Math.random() * H,
    radius: 60 + Math.random() * 120,
    color: [
      'rgba(80, 20, 120, 0.04)',
      'rgba(20, 60, 140, 0.035)',
      'rgba(140, 30, 60, 0.03)',
      'rgba(20, 100, 80, 0.035)',
      'rgba(100, 40, 100, 0.04)',
      'rgba(30, 80, 130, 0.03)',
    ][i],
    driftX: (Math.random() - 0.5) * 0.15,
    driftY: (Math.random() - 0.5) * 0.1,
    pulseSpeed: 0.3 + Math.random() * 0.4,
    pulseAmt: 0.3 + Math.random() * 0.3,
    parallaxFactor: 0.02 + Math.random() * 0.03,
  });
}

// Asteroid silhouettes that drift past
const bgAsteroids = [];
for (let i = 0; i < 8; i++) {
  bgAsteroids.push({
    x: Math.random() * W,
    y: Math.random() * H,
    size: 3 + Math.random() * 8,
    shape: Math.floor(Math.random() * 4),
    rotation: Math.random() * Math.PI * 2,
    rotSpeed: (Math.random() - 0.5) * 0.4,
    driftX: -0.1 - Math.random() * 0.3,
    driftY: (Math.random() - 0.5) * 0.1,
    brightness: 0.08 + Math.random() * 0.12,
    parallaxFactor: 0.04 + Math.random() * 0.06,
  });
}

// Distant galaxies - small spiral shapes far in the background
const bgGalaxies = [];
for (let i = 0; i < 3; i++) {
  bgGalaxies.push({
    x: 100 + Math.random() * (W - 200),
    y: 80 + Math.random() * (H - 160),
    size: 8 + Math.random() * 14,
    rotation: Math.random() * Math.PI * 2,
    rotSpeed: 0.02 + Math.random() * 0.03,
    color: [
      'rgba(180, 160, 220, 0.06)',
      'rgba(220, 180, 140, 0.05)',
      'rgba(140, 180, 220, 0.06)',
    ][i],
    coreColor: [
      'rgba(220, 200, 255, 0.1)',
      'rgba(255, 220, 180, 0.08)',
      'rgba(180, 220, 255, 0.1)',
    ][i],
    arms: 2 + Math.floor(Math.random() * 2),
    parallaxFactor: 0.01 + Math.random() * 0.015,
  });
}

// Comets with tails
const bgComets = [];
for (let i = 0; i < 2; i++) {
  bgComets.push({
    x: W + 50 + Math.random() * 200,
    y: Math.random() * H,
    speed: 0.8 + Math.random() * 1.2,
    tailLength: 30 + Math.random() * 50,
    size: 1.5 + Math.random() * 1.5,
    color: ['rgba(180, 220, 255, 0.7)', 'rgba(200, 255, 220, 0.6)'][i],
    tailColor: ['rgba(100, 150, 255, ', 'rgba(100, 220, 180, '][i],
    active: false,
    cooldown: 600 + Math.random() * 1200,
    timer: 300 + Math.random() * 600,
    angle: Math.PI + (Math.random() - 0.5) * 0.4,
  });
}

// Binary star systems - pairs of glowing dots that orbit each other
const bgBinaryStars = [];
for (let i = 0; i < 4; i++) {
  bgBinaryStars.push({
    x: 60 + Math.random() * (W - 120),
    y: 40 + Math.random() * (H - 80),
    separation: 3 + Math.random() * 5,
    orbitSpeed: 0.5 + Math.random() * 1.0,
    angle: Math.random() * Math.PI * 2,
    color1: ['#aaccff', '#ffddaa', '#ffaacc', '#aaffcc'][i],
    color2: ['#ffccaa', '#aaccff', '#ccaaff', '#ffccaa'][i],
    size1: 1 + Math.random() * 0.5,
    size2: 0.8 + Math.random() * 0.4,
    glowSize: 4 + Math.random() * 4,
    brightness: 0.4 + Math.random() * 0.3,
    parallaxFactor: 0.03 + Math.random() * 0.04,
  });
}

// Space debris/junk - visible during travel
const bgDebris = [];
for (let i = 0; i < 12; i++) {
  const debrisTypes = ['bolt', 'plate', 'wire', 'shard', 'pipe', 'chip'];
  bgDebris.push({
    x: Math.random() * W,
    y: Math.random() * H,
    type: debrisTypes[Math.floor(Math.random() * debrisTypes.length)],
    size: 1 + Math.random() * 3,
    rotation: Math.random() * Math.PI * 2,
    rotSpeed: (Math.random() - 0.5) * 1.5,
    driftX: -0.3 - Math.random() * 0.6,
    driftY: (Math.random() - 0.5) * 0.2,
    brightness: 0.1 + Math.random() * 0.15,
    color: ['#556677', '#667788', '#445566', '#778899', '#4a5a6a', '#5a6a7a'][Math.floor(Math.random() * 6)],
    parallaxFactor: 0.06 + Math.random() * 0.08,
  });
}

// Draw a single nebula cloud
function drawNebula(neb, scroll) {
  const offsetY = (scroll || 0) * neb.parallaxFactor;
  const nx = ((neb.x + gameTime * neb.driftX * 10) % (W + neb.radius * 2)) ;
  const ny = ((neb.y + offsetY + gameTime * neb.driftY * 10) % (H + neb.radius * 2));
  const pulse = 1 + Math.sin(gameTime * neb.pulseSpeed) * neb.pulseAmt * 0.1;
  const r = neb.radius * pulse;
  const grad = ctx.createRadialGradient(nx, ny, 0, nx, ny, r);
  grad.addColorStop(0, neb.color);
  grad.addColorStop(0.4, neb.color);
  grad.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(nx, ny, r, 0, Math.PI * 2);
  ctx.fill();
}

// Draw all nebula clouds
function drawNebulae(scroll) {
  for (let i = 0; i < bgNebulae.length; i++) {
    drawNebula(bgNebulae[i], scroll);
  }
}

// Draw an asteroid silhouette
function drawAsteroid(ast, scroll) {
  const offsetY = (scroll || 0) * ast.parallaxFactor;
  let ax = ast.x + gameTime * ast.driftX * 10;
  let ay = ast.y + offsetY + gameTime * ast.driftY * 10;
  ax = ((ax % (W + 40)) + W + 40) % (W + 40) - 20;
  ay = ((ay % (H + 40)) + H + 40) % (H + 40) - 20;
  const rot = ast.rotation + gameTime * ast.rotSpeed;
  ctx.save();
  ctx.translate(ax, ay);
  ctx.rotate(rot);
  ctx.globalAlpha = ast.brightness;
  ctx.fillStyle = '#1a1a2a';
  ctx.beginPath();
  const s = ast.size;
  if (ast.shape === 0) {
    ctx.moveTo(-s, -s * 0.5);
    ctx.lineTo(-s * 0.3, -s);
    ctx.lineTo(s * 0.6, -s * 0.8);
    ctx.lineTo(s, -s * 0.2);
    ctx.lineTo(s * 0.8, s * 0.6);
    ctx.lineTo(s * 0.1, s);
    ctx.lineTo(-s * 0.7, s * 0.7);
    ctx.closePath();
  } else if (ast.shape === 1) {
    ctx.moveTo(-s * 0.8, -s * 0.6);
    ctx.lineTo(0, -s);
    ctx.lineTo(s * 0.9, -s * 0.4);
    ctx.lineTo(s * 0.7, s * 0.5);
    ctx.lineTo(-s * 0.2, s * 0.9);
    ctx.lineTo(-s, s * 0.3);
    ctx.closePath();
  } else if (ast.shape === 2) {
    ctx.moveTo(-s, 0);
    ctx.lineTo(-s * 0.5, -s * 0.9);
    ctx.lineTo(s * 0.4, -s * 0.7);
    ctx.lineTo(s, -s * 0.1);
    ctx.lineTo(s * 0.6, s * 0.8);
    ctx.lineTo(-s * 0.4, s);
    ctx.lineTo(-s * 0.9, s * 0.4);
    ctx.closePath();
  } else {
    ctx.moveTo(-s * 0.6, -s);
    ctx.lineTo(s * 0.5, -s * 0.8);
    ctx.lineTo(s, 0);
    ctx.lineTo(s * 0.4, s * 0.9);
    ctx.lineTo(-s * 0.5, s * 0.7);
    ctx.lineTo(-s, s * 0.1);
    ctx.closePath();
  }
  ctx.fill();
  ctx.fillStyle = '#222233';
  ctx.beginPath();
  ctx.arc(s * 0.2, -s * 0.1, s * 0.2, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(-s * 0.3, s * 0.3, s * 0.12, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalAlpha = 1;
  ctx.restore();
}

// Draw all asteroids
function drawAsteroids(scroll) {
  for (let i = 0; i < bgAsteroids.length; i++) {
    drawAsteroid(bgAsteroids[i], scroll);
  }
}

// Draw a distant spiral galaxy
function drawGalaxy(gal, scroll) {
  const offsetY = (scroll || 0) * gal.parallaxFactor;
  const gx = gal.x;
  const gy = ((gal.y + offsetY) % H + H) % H;
  const rot = gal.rotation + gameTime * gal.rotSpeed;
  ctx.save();
  ctx.translate(gx, gy);
  ctx.rotate(rot);
  const coreGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, gal.size * 0.4);
  coreGrad.addColorStop(0, gal.coreColor);
  coreGrad.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = coreGrad;
  ctx.beginPath();
  ctx.arc(0, 0, gal.size * 0.4, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = gal.color;
  ctx.lineWidth = 1;
  for (let arm = 0; arm < gal.arms; arm++) {
    const armOffset = (Math.PI * 2 / gal.arms) * arm;
    ctx.beginPath();
    for (let t = 0; t < 3; t += 0.08) {
      const angle = armOffset + t * 1.2;
      const radius = t * gal.size * 0.18;
      const px = Math.cos(angle) * radius;
      const py = Math.sin(angle) * radius;
      if (t === 0) {
        ctx.moveTo(px, py);
      } else {
        ctx.lineTo(px, py);
      }
    }
    ctx.stroke();
  }
  ctx.restore();
}

// Draw all distant galaxies
function drawGalaxies(scroll) {
  for (let i = 0; i < bgGalaxies.length; i++) {
    drawGalaxy(bgGalaxies[i], scroll);
  }
}

// Draw a comet with glowing tail
function drawComet(comet, scroll) {
  if (!comet.active) return;
  const cx = comet.x;
  const cy = comet.y;
  const tailDx = Math.cos(comet.angle + Math.PI) * comet.tailLength;
  const tailDy = Math.sin(comet.angle + Math.PI) * comet.tailLength;
  const tailGrad = ctx.createLinearGradient(cx, cy, cx + tailDx, cy + tailDy);
  tailGrad.addColorStop(0, comet.tailColor + '0.5)');
  tailGrad.addColorStop(0.3, comet.tailColor + '0.2)');
  tailGrad.addColorStop(0.7, comet.tailColor + '0.05)');
  tailGrad.addColorStop(1, comet.tailColor + '0)');
  ctx.strokeStyle = tailGrad;
  ctx.lineWidth = comet.size * 1.5;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(cx, cy);
  ctx.lineTo(cx + tailDx, cy + tailDy);
  ctx.stroke();
  ctx.lineCap = 'butt';
  const headGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, comet.size * 3);
  headGrad.addColorStop(0, comet.color);
  headGrad.addColorStop(0.5, comet.tailColor + '0.3)');
  headGrad.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = headGrad;
  ctx.beginPath();
  ctx.arc(cx, cy, comet.size * 3, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#ffffff';
  ctx.globalAlpha = 0.9;
  ctx.beginPath();
  ctx.arc(cx, cy, comet.size * 0.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalAlpha = 1;
}

// Update comet positions and activation
function updateComets(dt) {
  for (let i = 0; i < bgComets.length; i++) {
    const c = bgComets[i];
    if (c.active) {
      c.x += Math.cos(c.angle) * c.speed * dt * 60;
      c.y += Math.sin(c.angle) * c.speed * dt * 60;
      if (c.x < -100 || c.x > W + 100 || c.y < -100 || c.y > H + 100) {
        c.active = false;
        c.timer = c.cooldown;
      }
    } else {
      c.timer -= dt * 60;
      if (c.timer <= 0) {
        c.active = true;
        const side = Math.floor(Math.random() * 4);
        if (side === 0) {
          c.x = W + 50;
          c.y = Math.random() * H;
          c.angle = Math.PI + (Math.random() - 0.5) * 0.6;
        } else if (side === 1) {
          c.x = -50;
          c.y = Math.random() * H;
          c.angle = (Math.random() - 0.5) * 0.6;
        } else if (side === 2) {
          c.x = Math.random() * W;
          c.y = -50;
          c.angle = Math.PI * 0.5 + (Math.random() - 0.5) * 0.6;
        } else {
          c.x = Math.random() * W;
          c.y = H + 50;
          c.angle = -Math.PI * 0.5 + (Math.random() - 0.5) * 0.6;
        }
        c.tailLength = 30 + Math.random() * 50;
        c.speed = 0.8 + Math.random() * 1.2;
      }
    }
  }
}

// Draw all comets
function drawComets(scroll) {
  for (let i = 0; i < bgComets.length; i++) {
    drawComet(bgComets[i], scroll);
  }
}

// Draw a binary star system
function drawBinaryStar(bin, scroll) {
  const offsetY = (scroll || 0) * bin.parallaxFactor;
  const bx = bin.x;
  const by = ((bin.y + offsetY) % H + H) % H;
  const a = bin.angle + gameTime * bin.orbitSpeed;
  const dx = Math.cos(a) * bin.separation;
  const dy = Math.sin(a) * bin.separation * 0.4;
  const x1 = bx + dx;
  const y1 = by + dy;
  const x2 = bx - dx;
  const y2 = by - dy;
  ctx.globalAlpha = bin.brightness * 0.2;
  const glow1 = ctx.createRadialGradient(x1, y1, 0, x1, y1, bin.glowSize);
  glow1.addColorStop(0, bin.color1);
  glow1.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = glow1;
  ctx.beginPath();
  ctx.arc(x1, y1, bin.glowSize, 0, Math.PI * 2);
  ctx.fill();
  const glow2 = ctx.createRadialGradient(x2, y2, 0, x2, y2, bin.glowSize * 0.8);
  glow2.addColorStop(0, bin.color2);
  glow2.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = glow2;
  ctx.beginPath();
  ctx.arc(x2, y2, bin.glowSize * 0.8, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalAlpha = bin.brightness;
  ctx.fillStyle = bin.color1;
  ctx.beginPath();
  ctx.arc(x1, y1, bin.size1, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = bin.color2;
  ctx.beginPath();
  ctx.arc(x2, y2, bin.size2, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalAlpha = 1;
}

// Draw all binary star systems
function drawBinaryStars(scroll) {
  for (let i = 0; i < bgBinaryStars.length; i++) {
    drawBinaryStar(bgBinaryStars[i], scroll);
  }
}

// Draw a single piece of space debris
function drawDebrisPiece(deb, scroll) {
  const offsetY = (scroll || 0) * deb.parallaxFactor;
  let dx = deb.x + gameTime * deb.driftX * 10;
  let dy = deb.y + offsetY + gameTime * deb.driftY * 10;
  dx = ((dx % (W + 30)) + W + 30) % (W + 30) - 15;
  dy = ((dy % (H + 30)) + H + 30) % (H + 30) - 15;
  const rot = deb.rotation + gameTime * deb.rotSpeed;
  ctx.save();
  ctx.translate(dx, dy);
  ctx.rotate(rot);
  ctx.globalAlpha = deb.brightness;
  ctx.fillStyle = deb.color;
  ctx.strokeStyle = deb.color;
  ctx.lineWidth = 0.5;
  const s = deb.size;
  if (deb.type === 'bolt') {
    ctx.fillRect(-s * 0.15, -s, s * 0.3, s * 2);
    ctx.fillRect(-s * 0.6, -s * 0.15, s * 1.2, s * 0.3);
  } else if (deb.type === 'plate') {
    ctx.fillRect(-s, -s * 0.6, s * 2, s * 1.2);
    ctx.strokeStyle = '#333344';
    ctx.strokeRect(-s * 0.8, -s * 0.4, s * 1.6, s * 0.8);
  } else if (deb.type === 'wire') {
    ctx.beginPath();
    ctx.moveTo(-s, -s * 0.3);
    ctx.quadraticCurveTo(0, s * 0.5, s, -s * 0.2);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(-s * 0.5, s * 0.2);
    ctx.quadraticCurveTo(s * 0.3, -s * 0.4, s * 0.8, s * 0.1);
    ctx.stroke();
  } else if (deb.type === 'shard') {
    ctx.beginPath();
    ctx.moveTo(0, -s);
    ctx.lineTo(s * 0.7, s * 0.4);
    ctx.lineTo(-s * 0.3, s * 0.8);
    ctx.lineTo(-s * 0.6, -s * 0.2);
    ctx.closePath();
    ctx.fill();
  } else if (deb.type === 'pipe') {
    ctx.fillRect(-s * 1.2, -s * 0.2, s * 2.4, s * 0.4);
    ctx.fillStyle = '#444455';
    ctx.fillRect(-s * 1.0, -s * 0.25, s * 0.2, s * 0.5);
    ctx.fillRect(s * 0.4, -s * 0.25, s * 0.2, s * 0.5);
  } else if (deb.type === 'chip') {
    ctx.fillRect(-s * 0.5, -s * 0.4, s, s * 0.8);
    ctx.fillStyle = '#334433';
    ctx.fillRect(-s * 0.35, -s * 0.25, s * 0.7, s * 0.5);
    ctx.fillStyle = '#556644';
    ctx.fillRect(-s * 0.15, -s * 0.1, s * 0.1, s * 0.2);
    ctx.fillRect(s * 0.1, -s * 0.1, s * 0.1, s * 0.2);
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

// Draw all space debris (only visible during travel for full effect, dimmed otherwise)
function drawSpaceDebris(scroll, isTraveling) {
  const alphaMultiplier = isTraveling ? 1.0 : 0.3;
  for (let i = 0; i < bgDebris.length; i++) {
    const originalBrightness = bgDebris[i].brightness;
    bgDebris[i].brightness = originalBrightness * alphaMultiplier;
    drawDebrisPiece(bgDebris[i], scroll);
    bgDebris[i].brightness = originalBrightness;
  }
}

// --- ENHANCED BACKGROUND (combines all layers) ---
function drawEnhancedBackground(scroll, isTraveling) {
  // Layer 0: Base starfield (farthest back)
  drawStarfield(scroll);

  // Layer 1: Distant galaxies (very far background)
  drawGalaxies(scroll);

  // Layer 2: Nebula clouds (far background, large and diffuse)
  drawNebulae(scroll);

  // Layer 3: Binary star systems (mid-background)
  drawBinaryStars(scroll);

  // Layer 4: Comets (mid-ground, animated)
  drawComets(scroll);

  // Layer 5: Asteroid silhouettes (mid to near)
  drawAsteroids(scroll);

  // Layer 6: Space debris/junk (nearest, most parallax, prominent during travel)
  drawSpaceDebris(scroll, isTraveling);
}

// Update all animated background elements (call once per frame)
function updateEnhancedBackground(dt) {
  updateComets(dt);
}

// --- PIXEL ART SPRITE SYSTEM ---
// Sprites defined as arrays of [color, x, y, w, h] rects

  const s = scale || 1;
  sprite.forEach(([color, sx, sy, sw, sh]) => {
    ctx.fillStyle = color;
    ctx.fillRect(x + sx * s, y + sy * s, (sw || 1) * s, (sh || 1) * s);
  });
}

// --- PROCEDURAL CREW SPRITE GENERATOR ---
// Deterministic hash from string -> stable pseudo-random sequence
function spriteHash(str) {
  let h = 5381;
  for (let i = 0; i < str.length; i++) h = ((h << 5) + h + str.charCodeAt(i)) & 0xffffffff;
  return h >>> 0;
}
function seededRand(seed) {
  let s = seed;
  return function() { s = (s * 1103515245 + 12345) & 0x7fffffff; return s / 0x7fffffff; };
}

const SKIN_TONES = ['#d4a574','#c68c5b','#8d5524','#e8c49a','#6b9bd2','#7bc47f','#a0a0b8','#c97bdb'];
const HAIR_COLORS = ['#2a1a0a','#5c3317','#c4a35a','#e8e8e8','#1a1a2e','#cc3333','#3388cc','#44dd88','#dd44aa'];
const OUTFIT_COLORS = {

};

  Engineer: [{c:'#ffaa44',x:4,y:11,w:1,h:3},{c:'#ffaa44',x:3,y:12,w:3,h:1}],

function generateCrewSprite(name, role) {
  const rand = seededRand(spriteHash(name));
  const sprite = [];
  const skinIdx = Math.floor(rand() * SKIN_TONES.length);
  const skin = SKIN_TONES[skinIdx];
  const skinDark = SKIN_TONES[skinIdx].replace(/[0-9a-f]{2}/gi, function(m) {
    return Math.max(0, parseInt(m, 16) - 30).toString(16).padStart(2, '0');
  });
  const hairColor = HAIR_COLORS[Math.floor(rand() * HAIR_COLORS.length)];
  const outfitPair = OUTFIT_COLORS[role] || ['#444455','#555566'];
  const outfitMain = outfitPair[0];
  const outfitLight = outfitPair[1];
  const bodyType = Math.floor(rand() * 3); // 0=slim, 1=avg, 2=stocky
  const hairStyle = Math.floor(rand() * 5); // 0=bald, 1=short, 2=mohawk, 3=long, 4=helmet
  const hasBeard = rand() < 0.2;
  const eyeColor = ['#44ddff','#44ff88','#ffaa44','#ff4488','#ffffff','#ff2222'][Math.floor(rand() * 6)];

  // --- BODY (torso) ---
  const bw = bodyType === 0 ? 6 : (bodyType === 1 ? 8 : 10);
  const bx = Math.floor((12 - bw) / 2);
  sprite.push([outfitMain, bx, 9, bw, 8]);
  sprite.push([outfitLight, bx + 1, 10, bw - 2, 6]);
  // Shoulders
  if (bodyType >= 1) {
    sprite.push([outfitMain, bx - 1, 9, 1, 4]);
    sprite.push([outfitMain, bx + bw, 9, 1, 4]);
  }

  // --- LEGS ---
  const lx = bx + 1;
  const lw = Math.floor((bw - 2) / 2);
  sprite.push([outfitMain, lx, 17, lw, 4]);
  sprite.push([outfitMain, lx + lw + 1, 17, lw, 4]);
  // Boots
  sprite.push(['#222233', lx, 21, lw, 2]);
  sprite.push(['#222233', lx + lw + 1, 21, lw, 2]);

  // --- ARMS ---
  sprite.push([skin, bx - 1, 11, 1, 5]);
  sprite.push([skin, bx + bw, 11, 1, 5]);

  // --- HEAD ---
  const headW = 6 + (bodyType > 0 ? 1 : 0);
  const headX = Math.floor((12 - headW) / 2);
  sprite.push([skin, headX, 2, headW, 7]);
  sprite.push([skinDark, headX, 7, headW, 1]); // chin shadow

  // --- EYES ---
  const eyeY = 4;
  const eyeLX = headX + 1;
  const eyeRX = headX + headW - 2;
  sprite.push([eyeColor, eyeLX, eyeY, 1, 1]);
  sprite.push([eyeColor, eyeRX, eyeY, 1, 1]);

  // --- MOUTH ---
  sprite.push([skinDark, headX + 2, 6, headW - 4, 1]);

  // --- HAIR ---
  if (hairStyle === 1) { // short
    sprite.push([hairColor, headX, 1, headW, 2]);
  } else if (hairStyle === 2) { // mohawk
    sprite.push([hairColor, headX + Math.floor(headW/2) - 1, 0, 2, 3]);
  } else if (hairStyle === 3) { // long
    sprite.push([hairColor, headX, 1, headW, 2]);
    sprite.push([hairColor, headX - 1, 2, 1, 5]);
    sprite.push([hairColor, headX + headW, 2, 1, 5]);
  } else if (hairStyle === 4) { // helmet
    sprite.push(['#556677', headX - 1, 1, headW + 2, 3]);
    sprite.push(['#667788', headX, 1, headW, 2]);
    sprite.push(['#44ddff', headX + 1, 3, headW - 2, 1]); // visor
  }
  // bald = no hair rects

  // --- BEARD ---
  if (hasBeard && hairStyle !== 4) {
    sprite.push([hairColor, headX + 1, 7, headW - 2, 2]);
  }

  // --- ROLE ACCENT ---
  const accents = ROLE_ACCENTS[role];
  if (accents) {
    for (let a = 0; a < accents.length; a++) {
      sprite.push([accents[a].c, accents[a].x, accents[a].y, accents[a].w, accents[a].h]);
    }
  }

  return sprite;
}

// Draw crew sprite with status effects
function drawCrewSprite(sprite, x, y, scale, alive, injured) {
  if (!alive) {
    ctx.globalAlpha = 0.3;
    drawSprite(sprite, x, y, scale);
    ctx.globalAlpha = 1;
    // X overlay
    ctx.strokeStyle = PAL.danger; ctx.lineWidth = 2;
    const cx = x + 6 * scale, cy = y + 11 * scale, r = 6 * scale;
    ctx.beginPath(); ctx.moveTo(cx - r, cy - r); ctx.lineTo(cx + r, cy + r); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx + r, cy - r); ctx.lineTo(cx - r, cy + r); ctx.stroke();
    ctx.lineWidth = 1;
  } else if (injured) {
    // Red tint flash
    drawSprite(sprite, x, y, scale);
    ctx.globalAlpha = 0.25 + Math.sin(gameTime * 4) * 0.1;
    ctx.fillStyle = PAL.danger;
    ctx.fillRect(x, y, 12 * scale, 23 * scale);
    ctx.globalAlpha = 1;
  } else {
    drawSprite(sprite, x, y, scale);
  }
}

// Planet drawing
function drawPlanet(x, y, radius, color1, color2, hasRing) {
  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath();
  ctx.arc(x + 2, y + 2, radius, 0, Math.PI * 2);
  ctx.fill();

  // Body
  const grad = ctx.createRadialGradient(x - radius * 0.3, y - radius * 0.3, 0, x, y, radius);
  grad.addColorStop(0, color1);
  grad.addColorStop(1, color2);
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(x, y, radius, 0, Math.PI * 2);
  ctx.fill();

  // Surface details
  ctx.globalAlpha = 0.15;
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.arc(x + radius * 0.2, y - radius * 0.1, radius * 0.3, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(x - radius * 0.3, y + radius * 0.3, radius * 0.15, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalAlpha = 1;

  // Atmosphere
  ctx.strokeStyle = color1;
  ctx.lineWidth = 1;
  ctx.globalAlpha = 0.3;
  ctx.beginPath();
  ctx.arc(x, y, radius + 2, 0, Math.PI * 2);
  ctx.stroke();
  ctx.globalAlpha = 1;

  if (hasRing) {
    ctx.strokeStyle = color1;
    ctx.lineWidth = 2;
    ctx.globalAlpha = 0.4;
    ctx.beginPath();
    ctx.ellipse(x, y, radius * 1.8, radius * 0.3, -0.2, 0, Math.PI * 2);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }
}

// --- UI DRAWING HELPERS ---
function drawPanel(x, y, w, h, highlight) {
  ctx.fillStyle = PAL.panel;
  ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = highlight || PAL.panelBorder;
  ctx.lineWidth = 1;
  ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
  // Corner accents
  const c = highlight || PAL.accent;
  ctx.fillStyle = c;
  ctx.fillRect(x, y, 3, 1);
  ctx.fillRect(x, y, 1, 3);
  ctx.fillRect(x + w - 3, y, 3, 1);
  ctx.fillRect(x + w - 1, y, 1, 3);
  ctx.fillRect(x, y + h - 1, 3, 1);
  ctx.fillRect(x, y + h - 3, 1, 3);
  ctx.fillRect(x + w - 3, y + h - 1, 3, 1);
  ctx.fillRect(x + w - 1, y + h - 3, 1, 3);
}

function drawBar(x, y, w, h, value, max, color, label) {
  const pct = Math.max(0, Math.min(1, value / max));
  ctx.fillStyle = '#0a0a14';
  ctx.fillRect(x, y, w, h);
  const barColor = pct < 0.2 ? PAL.danger : (pct < 0.4 ? PAL.warning : color);
  ctx.fillStyle = barColor;
  ctx.fillRect(x, y, w * pct, h);
  ctx.strokeStyle = '#333';
  ctx.lineWidth = 1;
  ctx.strokeRect(x, y, w, h);
  if (label) {
    ctx.fillStyle = PAL.text;
    ctx.font = '9px monospace';
    ctx.textAlign = 'left';
    ctx.fillText(label, x, y - 2);
    ctx.textAlign = 'right';
    ctx.fillText(Math.floor(value) + '/' + max, x + w, y - 2);
  }
}

// Button system
const buttons = [];
function clearButtons() { buttons.length = 0; }

function addButton(x, y, w, h, text, action, style) {
  buttons.push({ x, y, w, h, text, action, style: style || 'normal', hovered: false });
}

function drawButtons() {
  let keyIdx = 0;
  buttons.forEach((b) => {
    b.hovered = mouse.x >= b.x && mouse.x <= b.x + b.w &&
                mouse.y >= b.y && mouse.y <= b.y + b.h;

    // 'tab' style: click-target only, already drawn manually
    if (b.style === 'tab') {
      return;
    }

    if (b.style === 'danger') {
      ctx.fillStyle = b.hovered ? '#441122' : '#220a0a';
      ctx.strokeStyle = b.hovered ? PAL.danger : '#661122';
    } else if (b.style === 'good') {
      ctx.fillStyle = b.hovered ? '#112233' : '#0a1520';
      ctx.strokeStyle = b.hovered ? PAL.accent : PAL.accentDim;
    } else {
      ctx.fillStyle = b.hovered ? PAL.panelLight : PAL.panel;
      ctx.strokeStyle = b.hovered ? PAL.accent : PAL.panelBorder;
    }

    ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.lineWidth = b.hovered ? 2 : 1;
    ctx.strokeRect(b.x, b.y, b.w, b.h);

    ctx.fillStyle = b.hovered ? PAL.textBright : PAL.text;
    ctx.font = b.hovered ? 'bold 12px monospace' : '12px monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(b.text, b.x + b.w / 2, b.y + b.h / 2);
    ctx.textBaseline = 'alphabetic';

    // Key hint (skip for tab-style buttons)
    if (keyIdx < 9 && gameState !== STATE.COMBAT) {
      ctx.fillStyle = PAL.textDim;
      ctx.font = '9px monospace';
      ctx.textAlign = 'left';
      ctx.fillText('[' + (keyIdx + 1) + ']', b.x + 4, b.y + b.h / 2 + 3);
    }
    keyIdx++;
  });
}

function checkButtons() {
  if (!mouse.clicked) return;
  for (const b of buttons) {
    if (mouse.x >= b.x && mouse.x <= b.x + b.w &&
        mouse.y >= b.y && mouse.y <= b.y + b.h) {
      Audio.play('click');
      b.action();
      mouse.clicked = false;
      return;
    }
  }
}

// Text wrapping
function wrapText(text, maxWidth) {
  const words = text.split(' ');
  const lines = [];
  let line = '';
  for (const word of words) {
    const test = line ? line + ' ' + word : word;
    if (ctx.measureText(test).width > maxWidth && line) {
      lines.push(line);
      line = word;
    } else {
      line = test;
    }
  }
  if (line) lines.push(line);
  return lines;
}

function generateDestinations() {
  destinations = [];
  const count = 2 + (Math.random() < 0.3 ? 1 : 0);
  for (let i = 0; i < count; i++) {
    const hasStation = Math.random() < 0.4;
    const dist = 8 + Math.floor(Math.random() * 12) + sector * 2;
    const fuelCost = Math.ceil(dist * ship.fuelEfficiency * (0.8 + Math.random() * 0.4));
    const dangerLevel = Math.min(5, Math.floor(Math.random() * 3) + Math.floor(sector / 3));
    const colors = PLANET_COLORS[Math.floor(Math.random() * PLANET_COLORS.length)];
    const ptype = PLANET_TYPES[Math.floor(Math.random() * PLANET_TYPES.length)];
    destinations.push({
      name: randomName(), distance: dist, fuelCost, hasStation, dangerLevel,
      planetColor1: colors[0], planetColor2: colors[1],
      hasRing: Math.random() < 0.25,
      planetRadius: 15 + Math.floor(Math.random() * 20),
      eventChance: 0.35 + dangerLevel * 0.08,
      planetType: ptype,
    });
  }
}

// --- CONSEQUENCE SYSTEM ---
let pendingConsequences = [];
let activeQuests = [];

function addConsequence(type, turnsLeft, effects, storyText) {
  pendingConsequences.push({ type, turnsLeft, effects, storyText });
}

function checkConsequences() {
  for (let i = pendingConsequences.length - 1; i >= 0; i--) {
    pendingConsequences[i].turnsLeft--;
    if (pendingConsequences[i].turnsLeft <= 0) {
      const c = pendingConsequences.splice(i, 1)[0];
      addLog('CONSEQUENCE: ' + c.storyText, 'warning');
      if (c.effects) applyEffects(c.effects);
      // Some consequences trigger events
      if (c.type === 'loan_shark') {
        currentEvent = {
          id: 'loan_shark_collect', title: 'LOAN SHARK COLLECTION', icon: 'pirate', minSector: 1, weight: 0,
          text: 'A menacing ship drops out of warp. "You owe us 200 credits, with interest. Pay up or we take it from your hull."',
          choices: [
            { text: 'Pay 200 credits', action: 'check', stat: 'credits', threshold: 200, cost: { credits: -200 },
              successText: 'Debt paid. "Pleasure doing business. Don\'t borrow again."',
              failText: 'Can\'t pay!', failAction: 'combat', failCombatType: 'cruiser' },
            { text: 'Fight them off', action: 'combat', combatType: 'cruiser' },
          ],
        };
        eventResult = null;
        gameState = STATE.EVENT;
      }
      if (c.type === 'contraband') {
        currentEvent = {
          id: 'contraband_bust', title: 'CUSTOMS CHECKPOINT', icon: 'pirate', minSector: 1, weight: 0,
          text: 'A patrol ship scans your cargo. "Illegal contraband detected! Prepare to be boarded!"',
          choices: [

let crewMembers = [];

function generateCrew(count) {
  crewMembers = [];
  const usedNames = {};
  for (let i = 0; i < count; i++) {
    let name;
    do {
      name = CREW_FIRST_NAMES[Math.floor(Math.random() * CREW_FIRST_NAMES.length)] + ' ' +
             CREW_LAST_NAMES[Math.floor(Math.random() * CREW_LAST_NAMES.length)];
    } while (usedNames[name]);
    usedNames[name] = true;
    const role = CREW_ROLES[i % CREW_ROLES.length];
    crewMembers.push({
      name, role,
      quirk: CREW_QUIRKS[Math.floor(Math.random() * CREW_QUIRKS.length)],
      sprite: generateCrewSprite(name, role),
      hp: 100, maxHp: 100, xp: 0, level: 1,
      alive: true, injured: false,
    });
  }
  return crewMembers;
}

function getCrewBonus(role) {
  let bonus = 0;
  for (const cm of crewMembers) {
    if (!cm.alive) continue;
    if (cm.role === role) bonus += 0.15 + cm.level * 0.02;
    if (cm.injured) bonus *= 0.5;
  }
  return bonus;
}

function getAliveCrewCount() {
  return crewMembers.filter(c => c.alive).length;
}

function killRandomCrew() {
  const alive = crewMembers.filter(c => c.alive);
  if (alive.length === 0) return;
  // Medic can prevent deaths
  if (getCrewBonus('Medic') > 0 && Math.random() < 0.4) {
    addLog('Your Medic saves a crew member from death!', 'good');
    return;
  }
  const victim = alive[Math.floor(Math.random() * alive.length)];
  victim.alive = false;
  crewLost++;
  res.crew = getAliveCrewCount();
  addLog(victim.name + ' (' + victim.role + ') has died.', 'bad');
}

// --- EVENT SYSTEM FUNCTIONS ---
function pickEvent() {
  const eligible = EVENTS.filter(e => {
    if (e.minSector && sector < e.minSector) return false;
    if (e.repMin && res.reputation < e.repMin) return false;
    if (e.moraleMax && res.morale > e.moraleMax) return false;
    return true;
  });
  const navBonus = getCrewBonus('Navigator');
  const totalWeight = eligible.reduce((s, e) => s + (e.weight || 1), 0);
  let r = Math.random() * totalWeight;
  for (const e of eligible) {
    r -= (e.weight || 1);
    if (r <= 0) return JSON.parse(JSON.stringify(e));
  }
  return JSON.parse(JSON.stringify(eligible[0]));
}

function applyEffects(effects) {
  if (!effects) return;
  for (const [key, val] of Object.entries(effects)) {
    if (key === 'crew') {
      if (val < 0) {
        for (let i = 0; i < Math.abs(val); i++) killRandomCrew();
      } else {
        // Add generic crew members
        for (let i = 0; i < val; i++) {
          if (crewMembers.length < res.maxCrew) {
            const name = CREW_FIRST_NAMES[Math.floor(Math.random() * CREW_FIRST_NAMES.length)] + ' ' +
                         CREW_LAST_NAMES[Math.floor(Math.random() * CREW_LAST_NAMES.length)];
            const role = CREW_ROLES[Math.floor(Math.random() * CREW_ROLES.length)];
            crewMembers.push({
              name, role,
              quirk: CREW_QUIRKS[Math.floor(Math.random() * CREW_QUIRKS.length)],
              sprite: generateCrewSprite(name, role),
              hp: 100, maxHp: 100, xp: 0, level: 1, alive: true, injured: false,
            });
          }
        }
        res.crew = getAliveCrewCount();
      }
    } else if (key in res) {
      const max = RES_MAX[key] || 99999;
      res[key] = Math.max(0, Math.min(max, res[key] + val));
      if (key === 'credits' && val > 0) creditsEarned += val;
    }
  }
}

function resolveChoice(choice) {
  switch(choice.action) {
    case 'gain':
    case 'lose':
      applyEffects(choice.effects || choice.cost);
      eventResult = { text: choice.successText, good: choice.action === 'gain' };
      if (choice.successEffects) applyEffects(choice.successEffects);
      Audio.play(choice.action === 'gain' ? 'good' : 'bad');
      break;
    case 'check':
      if (res[choice.stat] >= choice.threshold) {
        applyEffects(choice.cost);
        if (choice.successEffects) applyEffects(choice.successEffects);
        eventResult = { text: choice.successText, good: true };
        Audio.play('good');
      } else {
        eventResult = { text: choice.failText, good: false };
        if (choice.failEffects) applyEffects(choice.failEffects);
        if (choice.failAction === 'combat') { startCombat(choice.failCombatType || 'raider'); return; }
        Audio.play('bad');
      }
      break;
    case 'random': {
      let chance = choice.good || 0.5;
      chance += getCrewBonus('Navigator') * 0.1;
      if (Math.random() < chance) {
        if (choice.successEffects) applyEffects(choice.successEffects);
        eventResult = { text: choice.successText, good: true };
        Audio.play('good');
      } else {
        if (choice.failEffects) applyEffects(choice.failEffects);
        eventResult = { text: choice.failText, good: false };
        Audio.play('bad');
      }
      break;
    }
    case 'combat':
      startCombat(choice.combatType || 'raider');
      return;
  }
  checkDeath();
}

// --- COMBAT SYSTEM ---
function startCombat(type) {
  Audio.play('alarm');
  const diff = difficulty();
  const gunnerBonus = 1 + getCrewBonus('Gunner');
  const configs = {
    raider: { name: 'PIRATE RAIDER', hp: 20 + sector * 5, fireRate: 1.2 / diff, speed: 80 * diff, reward: 60, sprite: 'raider' },
    cruiser: { name: 'PIRATE CRUISER', hp: 40 + sector * 8, fireRate: 0.8 / diff, speed: 60 * diff, reward: 120, sprite: 'cruiser' },
    boss: { name: 'DREADNOUGHT', hp: 80 + sector * 15, fireRate: 0.5 / diff, speed: 50 * diff, reward: 250, sprite: 'boss' },
  };
  const cfg = configs[type] || configs.raider;
  combat = {
    type, playerY: H / 2,
    playerHP: Math.min(res.hull, 50 + ship.shieldStrength * 10),
    playerMaxHP: 50 + ship.shieldStrength * 10,
    enemyX: W - 120, enemyY: H / 2,
    enemyHP: cfg.hp, enemyMaxHP: cfg.hp,
    enemyName: cfg.name, enemyFireRate: cfg.fireRate,
    enemyFireTimer: cfg.fireRate, enemySpeed: cfg.speed,
    enemyDir: 1, sprite: cfg.sprite, reward: cfg.reward,
    bullets: [], enemyBullets: [], fireTimer: 0, fireRate: 0.15,
    timer: 0, result: null, resultTimer: 0, particles: [],
    gunnerBonus,
  };
  gameState = STATE.COMBAT;
}

function updateCombat(dt) {
  if (!combat) return;
  combat.timer += dt;
  if (combat.result) { combat.resultTimer += dt; return; }

  const targetY = mouse.y;
  combat.playerY += (targetY - combat.playerY) * 8 * dt;
  combat.playerY = Math.max(60, Math.min(H - 60, combat.playerY));

  // Pilot dodge bonus
  const pilotDodge = getCrewBonus('Pilot') * 0.15;

  combat.fireTimer -= dt;
  if (combat.fireTimer <= 0 && res.ammo > 0) {
    combat.fireTimer = combat.fireRate;
    res.ammo = Math.max(0, res.ammo - 1);
    combat.bullets.push({ x: 140, y: combat.playerY, vx: 500, vy: (Math.random() - 0.5) * 30 });
    Audio.play('shoot');
  }

  combat.enemyY += combat.enemyDir * combat.enemySpeed * dt;
  if (combat.enemyY < 80 || combat.enemyY > H - 80) combat.enemyDir *= -1;
  combat.enemyX = W - 120 + Math.sin(combat.timer * 1.5) * 40;

  combat.enemyFireTimer -= dt;
  if (combat.enemyFireTimer <= 0) {
    combat.enemyFireTimer = combat.enemyFireRate;
    const ang = Math.atan2(combat.playerY - combat.enemyY, 120 - combat.enemyX);
    const spd = 200 + sector * 15;
    combat.enemyBullets.push({ x: combat.enemyX - 20, y: combat.enemyY, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd });
    if (combat.type === 'boss' || combat.type === 'cruiser') {
      combat.enemyBullets.push({ x: combat.enemyX - 20, y: combat.enemyY - 15, vx: -spd, vy: -40 });
      combat.enemyBullets.push({ x: combat.enemyX - 20, y: combat.enemyY + 15, vx: -spd, vy: 40 });
    }
  }

  combat.bullets.forEach(b => { b.x += b.vx * dt; b.y += b.vy * dt; });
  combat.enemyBullets.forEach(b => { b.x += b.vx * dt; b.y += b.vy * dt; });

  for (let i = combat.bullets.length - 1; i >= 0; i--) {
    const b = combat.bullets[i];
    const dx = b.x - combat.enemyX, dy = b.y - combat.enemyY;
    if (Math.sqrt(dx * dx + dy * dy) < 30) {
      combat.enemyHP -= ship.weaponPower * combat.gunnerBonus;
      combat.bullets.splice(i, 1);
      for (let j = 0; j < 3; j++) {
        combat.particles.push({ x: b.x, y: b.y, vx: (Math.random()-0.5)*200, vy: (Math.random()-0.5)*200, life: 0.3, color: PAL.warning });
      }
      continue;
    }
    if (b.x > W + 10) combat.bullets.splice(i, 1);
  }

  for (let i = combat.enemyBullets.length - 1; i >= 0; i--) {
    const b = combat.enemyBullets[i];
    const dx = b.x - 120, dy = b.y - combat.playerY;
    if (Math.sqrt(dx * dx + dy * dy) < 20) {
      // Pilot dodge chance
      if (Math.random() < pilotDodge) {
        combat.enemyBullets.splice(i, 1);
        continue;
      }
      combat.playerHP -= 5;
      combat.enemyBullets.splice(i, 1);
      for (let j = 0; j < 3; j++) {
        combat.particles.push({ x: 120, y: combat.playerY, vx: (Math.random()-0.5)*200, vy: (Math.random()-0.5)*200, life: 0.3, color: PAL.fuel });
      }
      continue;
    }
    if (b.x < -10 || b.y < -10 || b.y > H + 10) combat.enemyBullets.splice(i, 1);
  }

  combat.particles.forEach(p => { p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; });
  combat.particles = combat.particles.filter(p => p.life > 0);

  if (combat.enemyHP <= 0) {
    combat.result = 'win';
    Audio.play('explode');
    piratesDefeated++; shipsRaided++;
    res.credits += combat.reward; creditsEarned += combat.reward;
    res.reputation += 5;
    addLog('Defeated ' + combat.enemyName + '! +' + combat.reward + ' credits', 'good');
    for (let i = 0; i < 20; i++) {
      combat.particles.push({
        x: combat.enemyX, y: combat.enemyY,
        vx: (Math.random()-0.5)*400, vy: (Math.random()-0.5)*400,
        life: 0.5 + Math.random() * 0.5,
        color: [PAL.warning, PAL.danger, PAL.gold, '#fff'][Math.floor(Math.random()*4)]
      });
    }
    // Crew gains XP
    crewMembers.filter(c => c.alive).forEach(c => { c.xp += 10; if (c.xp >= c.level * 30) { c.level++; c.xp = 0; } });
  }
  if (combat.playerHP <= 0) {
    combat.result = 'lose';
    Audio.play('bad');
    res.hull = Math.max(5, res.hull - 25);
    res.morale -= 10;
    addLog('Lost battle against ' + combat.enemyName + '.', 'bad');
  }
  if (res.ammo <= 0 && combat.bullets.length === 0) {
    combat.result = 'retreat';
    res.hull = Math.max(5, res.hull - 15);
    addLog('Retreated from ' + combat.enemyName + ' - out of ammo!', 'bad');
    Audio.play('bad');
  }
}

function drawCombat() {
  ctx.fillStyle = PAL.space;
  ctx.fillRect(0, 0, W, H);
  drawEnhancedBackground(combat.timer * 50, true);

  if (combat.result) {
    combat.particles.forEach(p => {
      ctx.globalAlpha = p.life * 2;
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
    });
    ctx.globalAlpha = 1;
    drawPanel(W/2-200, H/2-80, 400, 160);
    ctx.textAlign = 'center';
    if (combat.result === 'win') {
      ctx.fillStyle = PAL.accent; ctx.font = 'bold 20px monospace';
      ctx.fillText('VICTORY!', W/2, H/2-40);
      ctx.fillStyle = PAL.gold; ctx.font = '14px monospace';
      ctx.fillText('+' + combat.reward + ' credits', W/2, H/2-10);
    } else {
      ctx.fillStyle = PAL.danger; ctx.font = 'bold 20px monospace';
      ctx.fillText(combat.result === 'retreat' ? 'RETREAT!' : 'DEFEAT!', W/2, H/2-40);
      ctx.fillStyle = PAL.warning; ctx.font = '14px monospace';
      ctx.fillText('Hull damaged severely', W/2, H/2-10);
    }
    clearButtons();
    addButton(W/2-80, H/2+30, 160, 36, 'CONTINUE', () => {
      combat = null; eventResult = null; currentEvent = null;
      checkDeath();
      if (gameState !== STATE.GAMEOVER && gameState !== STATE.DEATH_ANIM) {
        if (travelProgress < travelDistance) gameState = STATE.TRAVEL;
        else arriveAtDestination();
      }
    }, 'good');
    drawButtons(); checkButtons();
    return;
  }

  drawSprite(SHIP_SPRITE, 120 - 32, combat.playerY - 24, 2);
  if (combat.enemyHP > 0) {
    ctx.save();
    ctx.translate(combat.enemyX, combat.enemyY);
    ctx.scale(-2, 2);
    const spr = ENEMY_SPRITES[combat.sprite] || ENEMY_SPRITES.raider;
    spr.forEach(([color, sx, sy, sw, sh]) => {
      ctx.fillStyle = color;
      ctx.fillRect(sx - 16, sy - 16, sw || 1, sh || 1);
    });
    ctx.restore();
  }

  ctx.fillStyle = PAL.gold; ctx.shadowColor = PAL.gold; ctx.shadowBlur = 6;
  combat.bullets.forEach(b => { ctx.fillRect(b.x-4, b.y-1, 8, 2); });
  ctx.shadowBlur = 0;
  ctx.fillStyle = PAL.danger; ctx.shadowColor = PAL.danger; ctx.shadowBlur = 6;
  combat.enemyBullets.forEach(b => { ctx.fillRect(b.x-3, b.y-3, 6, 6); });
  ctx.shadowBlur = 0;

  combat.particles.forEach(p => {
    ctx.globalAlpha = Math.max(0, p.life * 2);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x-2, p.y-2, 4, 4);
  });
  ctx.globalAlpha = 1;

  drawPanel(10, 10, 200, 50);
  ctx.fillStyle = PAL.text; ctx.font = '10px monospace'; ctx.textAlign = 'left';
  ctx.fillText('YOUR SHIP', 18, 26);
  drawBar(18, 32, 180, 8, combat.playerHP, combat.playerMaxHP, PAL.fuel);
  ctx.fillStyle = PAL.textDim;
  ctx.fillText('AMMO: ' + res.ammo, 18, 55);

  drawPanel(W-210, 10, 200, 50);
  ctx.fillStyle = PAL.danger; ctx.font = '10px monospace'; ctx.textAlign = 'left';
  ctx.fillText(combat.enemyName, W-202, 26);
  drawBar(W-202, 32, 180, 8, combat.enemyHP, combat.enemyMaxHP, PAL.danger);

  ctx.fillStyle = PAL.textDim; ctx.font = '10px monospace'; ctx.textAlign = 'center';
  ctx.fillText('MOVE MOUSE/TOUCH TO DODGE  |  AUTO-FIRE', W/2, H-15);
}

const QUEST_TYPES = [
  { type: 'deliver_cargo', title: 'Deliver Package', desc: 'Deliver cargo to the next station.', reward: 70 },
  { type: 'hunt_pirate', title: 'Pirate Bounty', desc: 'Take out a pirate in the next sector.', reward: 90 },
  { type: 'find_person', title: 'Missing Person', desc: 'Find a missing crew member\'s relative.', reward: 60 },
  { type: 'smuggle', title: 'Smuggle Goods', desc: 'Transport "merchandise" discreetly.', reward: 100 },
];

function generateQuest() {
  const qt = QUEST_TYPES[Math.floor(Math.random() * QUEST_TYPES.length)];
  return { ...qt, accepted: false, completed: false, turnsLeft: 3 + Math.floor(Math.random() * 3) };
}

const DEAL_TYPES = [
  { type: 'cheap_cargo', title: 'Totally Legal Cargo', desc: '"Great price, no questions asked." (-20 cr)', cost: 20, consequence: 'contraband', turns: 3, cText: 'Customs found the contraband!' },
  { type: 'engine_mod', title: 'Experimental Engine Mod', desc: '"Barely exploded last time." (-40 cr, +fuel efficiency)', cost: 40, consequence: 'experimental_mod', turns: 4, cText: 'The engine mod malfunctions!' },
  { type: 'loan_shark', title: 'Quick Credits', desc: '"Need cash? +150 credits now. Pay 200 later."', cost: 0, consequence: 'loan_shark', turns: 4, cText: 'The loan shark sends collectors!' },
  { type: 'mystery_cargo', title: 'Mystery Crate', desc: '"Don\'t. Open. It." (-10 cr)', cost: 10, consequence: 'cargo_alive', turns: 3, cText: 'The mystery cargo is alive!' },
];

function enterStation() {
  const priceMultiplier = 1 + (sector - 1) * 0.2 + (res.reputation > 70 ? 0.3 : 0);
  const smugglerDiscount = 1 - getCrewBonus('Smuggler') * 0.15;
  stationData = {
    name: travelDestination.name,
    prices: {
      fuel: Math.ceil(3 * priceMultiplier * smugglerDiscount),
      food: Math.ceil(2 * priceMultiplier * smugglerDiscount),
      ammo: Math.ceil(4 * priceMultiplier * smugglerDiscount),
      parts: Math.ceil(8 * priceMultiplier * smugglerDiscount),
      repair: Math.ceil(5 * priceMultiplier * smugglerDiscount),
      crew: Math.ceil(20 * priceMultiplier),
      oxygen: Math.ceil(2 * priceMultiplier * smugglerDiscount),
    },
  };
  stationTab = 'trade';
  stationBarNPC = BAR_NPCS[Math.floor(Math.random() * BAR_NPCS.length)];
  stationRumors = [generateRumor(), generateRumor(), generateRumor()];
  stationQuests = [generateQuest()];
  if (Math.random() < 0.5) stationQuests.push(generateQuest());
  stationDeals = [DEAL_TYPES[Math.floor(Math.random() * DEAL_TYPES.length)]];
  if (Math.random() < 0.5) stationDeals.push(DEAL_TYPES[Math.floor(Math.random() * DEAL_TYPES.length)]);
  gameState = STATE.STATION;
  addLog('Docked at ' + stationData.name, 'info');
}

function drawStation() {
  ctx.fillStyle = PAL.space;
  ctx.fillRect(0, 0, W, H);
  drawEnhancedBackground(0, false);

  // Station sprite with idle animation
  const stationBob = Math.sin(gameTime * 1.5) * 3;
  drawSprite(STATION_SPRITE, W/2-64, 15 + stationBob, 4);
  // Blinking docking lights
  const blink1 = Math.sin(gameTime * 3) > 0;
  const blink2 = Math.sin(gameTime * 3 + 2) > 0;
  ctx.fillStyle = blink1 ? '#ff4444' : '#441111';
  ctx.fillRect(W/2 - 68, 67 + stationBob, 6, 6);
  ctx.fillStyle = blink2 ? '#44ff44' : '#114411';
  ctx.fillRect(W/2 + 62, 67 + stationBob, 6, 6);
  // Docking bay glow
  ctx.globalAlpha = 0.3 + Math.sin(gameTime * 2) * 0.15;
  ctx.fillStyle = PAL.accent;
  ctx.fillRect(W/2 - 16, 60 + stationBob, 32, 8);
  ctx.globalAlpha = 1;

  ctx.fillStyle = PAL.accent; ctx.font = 'bold 16px monospace'; ctx.textAlign = 'center';
  ctx.fillText(stationData.name, W/2, 155);
  ctx.fillStyle = PAL.textDim; ctx.font = '10px monospace';
  ctx.fillText('SECTOR ' + sector + '  |  CREDITS: ' + res.credits, W/2, 170);

  // Tabs
  clearButtons();
  const tabs = ['trade','bar','rumors','quests','deals'];
  const tabLabels = ['TRADE','BAR','RUMORS','QUESTS','DEALS'];
  const tabW = 100;
  const tabStartX = (W - tabs.length * tabW) / 2;
  tabs.forEach((tab, i) => {
    const tx = tabStartX + i * tabW;
    const isActive = stationTab === tab;
    ctx.fillStyle = isActive ? PAL.panelLight : PAL.panel;
    ctx.fillRect(tx, 180, tabW - 2, 24);
    ctx.strokeStyle = isActive ? PAL.accent : PAL.panelBorder;
    ctx.lineWidth = isActive ? 2 : 1;
    ctx.strokeRect(tx, 180, tabW - 2, 24);
    ctx.fillStyle = isActive ? PAL.accent : PAL.textDim;
    ctx.font = isActive ? 'bold 10px monospace' : '10px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(tabLabels[i], tx + (tabW - 2) / 2, 196);
    addButton(tx, 180, tabW - 2, 24, '', () => { stationTab = tab; }, 'tab');
  });

  const panelY = 210;
  const panelH = H - panelY - 50;
  drawPanel(20, panelY, W - 40, panelH);

  switch(stationTab) {
    case 'trade': drawStationTrade(panelY); break;
    case 'bar': drawStationBar(panelY); break;
    case 'rumors': drawStationRumors(panelY); break;
    case 'quests': drawStationQuests(panelY); break;
    case 'deals': drawStationDeals(panelY); break;
  }

  // Leave button
  addButton(W - 180, H - 42, 160, 30, 'LEAVE STATION', () => {
    stationData = null;
    generateDestinations();
    gameState = STATE.TRAVEL;
    travelProgress = 0; travelDistance = 0; travelDestination = null;
  }, 'normal');

  drawButtons(); checkButtons();
}

function drawStationTrade(panelY) {
  const sp = stationData.prices;
  ctx.fillStyle = PAL.accent; ctx.font = 'bold 11px monospace'; ctx.textAlign = 'left';
  ctx.fillText('RESOURCE', 40, panelY + 20);
  ctx.fillText('STOCK', 200, panelY + 20);
  ctx.fillText('PRICE', 310, panelY + 20);

  const items = [
    { key: 'fuel', label: 'FUEL', max: RES_MAX.fuel, color: PAL.fuel, amount: 10 },
    { key: 'food', label: 'FOOD', max: RES_MAX.food, color: PAL.food, amount: 10 },
    { key: 'ammo', label: 'AMMO', max: RES_MAX.ammo, color: PAL.ammo, amount: 10 },
    { key: 'parts', label: 'SHIP PARTS', max: RES_MAX.parts, color: PAL.parts, amount: 5 },
    { key: 'oxygen', label: 'OXYGEN', max: RES_MAX.oxygen, color: PAL.oxygen, amount: 10 },
    { key: 'crew', label: 'HIRE CREW', max: res.maxCrew, color: PAL.morale, amount: 1, special: 'crew' },
    { key: 'repair', label: 'HULL REPAIR', max: ship.hullMax, color: PAL.hull, amount: 10, special: 'repair' },
  ];

  items.forEach((item, i) => {
    const iy = panelY + 38 + i * 36;
    const price = sp[item.key] * item.amount;
    const currentVal = item.special === 'repair' ? res.hull : res[item.key];
    const maxVal = item.max;

    ctx.fillStyle = item.color; ctx.font = '11px monospace'; ctx.textAlign = 'left';
    ctx.fillText(item.label, 40, iy + 4);
    ctx.fillStyle = PAL.text;
    ctx.fillText(Math.floor(currentVal) + '/' + maxVal, 200, iy + 4);
    ctx.fillStyle = PAL.gold;
    ctx.fillText(price + ' cr', 310, iy + 4);
    // Preview sprite for crew hire
    if (item.special === 'crew' && currentVal < maxVal) {
      const previewSprite = generateCrewSprite(stationData.name + sector, 'Smuggler');
      drawSprite(previewSprite, 148, iy - 12, 2);
    }

    const canBuy = res.credits >= price && currentVal < maxVal;
    addButton(420, iy - 10, 90, 24, 'BUY +' + item.amount, () => {
      if (res.credits >= price && currentVal < maxVal) {
        res.credits -= price;
        if (item.special === 'repair') res.hull = Math.min(ship.hullMax, res.hull + item.amount);
        else if (item.special === 'crew') {
          if (crewMembers.length < res.maxCrew) {
            const nm = CREW_FIRST_NAMES[Math.floor(Math.random()*CREW_FIRST_NAMES.length)] + ' ' +
                       CREW_LAST_NAMES[Math.floor(Math.random()*CREW_LAST_NAMES.length)];
            const rl = CREW_ROLES[Math.floor(Math.random()*CREW_ROLES.length)];
            crewMembers.push({ name: nm, role: rl,
              quirk: CREW_QUIRKS[Math.floor(Math.random()*CREW_QUIRKS.length)],
              sprite: generateCrewSprite(nm, rl),
              hp:100, maxHp:100, xp:0, level:1, alive:true, injured:false });
            res.crew = getAliveCrewCount();
          }
        } else res[item.key] = Math.min(maxVal, res[item.key] + item.amount);
        Audio.play('good');
      } else Audio.play('bad');
    }, canBuy ? 'good' : 'normal');

    if (!item.special && item.key !== 'oxygen') {
      const sellPrice = Math.max(1, Math.floor(price * 0.5));
      addButton(520, iy - 10, 90, 24, 'SELL -' + item.amount, () => {
        if (res[item.key] >= item.amount) {
          res[item.key] -= item.amount;
          res.credits += sellPrice; creditsEarned += sellPrice;
          Audio.play('good');
        } else Audio.play('bad');
      }, 'normal');
    }
  });

  // Rest button
  addButton(40, panelY + 295, 200, 26, 'REST  -5 FOOD  +15 MORALE', () => {
    if (res.food >= 5) { res.food -= 5; res.morale = Math.min(100, res.morale + 15); Audio.play('good'); }
    else Audio.play('bad');
  }, res.food >= 5 ? 'good' : 'normal');
}

function drawStationBar(panelY) {
  ctx.fillStyle = PAL.accent; ctx.font = 'bold 14px monospace'; ctx.textAlign = 'center';
  ctx.fillText('THE RUSTY AIRLOCK', W/2, panelY + 25);

  // NPC with sprite
  if (stationBarNPC) {
    const npcSprite = generateCrewSprite(stationBarNPC.name, 'Smuggler');
    drawSprite(npcSprite, 50, panelY + 38, 3);
    ctx.fillStyle = PAL.textBright; ctx.font = '11px monospace'; ctx.textAlign = 'left';
    ctx.fillText(stationBarNPC.name + ':', 92, panelY + 50);
    ctx.fillStyle = PAL.text; ctx.font = '10px monospace';
    const lines = wrapText('"' + stationBarNPC.dialogue + '"', W - 150);
    lines.forEach((l, i) => ctx.fillText(l, 92, panelY + 67 + i * 14));
  }

  // Bar atmosphere
  ctx.fillStyle = PAL.textDim; ctx.font = '9px monospace'; ctx.textAlign = 'left';
  ctx.fillText('The bar smells of engine grease and regret. A jukebox plays something unidentifiable.', 50, panelY + 115);

  let by = panelY + 145;
  addButton(50, by, 220, 28, 'BUY DRINKS  -10 CR', () => {
    if (res.credits >= 10) { res.credits -= 10; res.morale = Math.min(100, res.morale + 10); Audio.play('good'); addLog('Bought drinks at the bar. Morale up!', 'good'); }
    else Audio.play('bad');
  }, res.credits >= 10 ? 'good' : 'normal');

  addButton(290, by, 220, 28, 'DRINKING CONTEST', () => {
    if (Math.random() < 0.6) {
      res.morale = Math.min(100, res.morale + 15);
      Audio.play('good');
      addLog('Won the drinking contest! Morale soars!', 'good');
    } else {
      const alive = crewMembers.filter(c => c.alive);
      if (alive.length > 0) {
        const v = alive[Math.floor(Math.random() * alive.length)];
        v.injured = true;
        addLog(v.name + ' got injured in the drinking contest!', 'bad');
      }
      Audio.play('bad');
    }
  }, 'normal');

  by += 38;
  addButton(50, by, 220, 28, 'LOOK FOR TROUBLE', () => {
    const brawlerBonus = getCrewBonus('Brawler') * 0.2;
    if (Math.random() < 0.5 + brawlerBonus) {
      res.credits += 40; creditsEarned += 40;
      res.reputation += 3;
      Audio.play('good');
      addLog('Won a bar fight! +40 credits', 'good');
    } else {
      const alive = crewMembers.filter(c => c.alive);
      if (alive.length > 0) alive[Math.floor(Math.random() * alive.length)].injured = true;
      res.morale -= 5;
      Audio.play('bad');
      addLog('Lost a bar fight. Crew member injured.', 'bad');
    }
  }, 'normal');

  addButton(290, by, 220, 28, 'HIRE SHADY CREW  -30 CR', () => {
    if (res.credits >= 30 && crewMembers.length < res.maxCrew) {
      res.credits -= 30;
      const nm = CREW_FIRST_NAMES[Math.floor(Math.random()*CREW_FIRST_NAMES.length)] + ' ' +
                 CREW_LAST_NAMES[Math.floor(Math.random()*CREW_LAST_NAMES.length)];
      const rl = CREW_ROLES[Math.floor(Math.random()*CREW_ROLES.length)];
      crewMembers.push({ name: nm, role: rl,
        quirk: 'questionable past', sprite: generateCrewSprite(nm, rl),
        hp:100, maxHp:100, xp:0, level:1, alive:true, injured:false });
      res.crew = getAliveCrewCount();
      Audio.play('good');
      addLog('Hired ' + nm + ' from the bar. Seems... trustworthy.', 'info');
    } else Audio.play('bad');
  }, res.credits >= 30 ? 'good' : 'normal');

  // Crew roster with sprite portraits
  by += 45;
  ctx.fillStyle = PAL.accent; ctx.font = 'bold 10px monospace'; ctx.textAlign = 'left';
  ctx.fillText('CREW ROSTER (' + getAliveCrewCount() + '/' + crewMembers.length + ')', 50, by);
  by += 8;
  const perRow = 7;
  const cellW = 90, cellH = 68;
  const rosterStartX = 42;
  crewMembers.forEach((cm, i) => {
    if (i >= 14) return; // max 2 rows
    const col = i % perRow;
    const row = Math.floor(i / perRow);
    const cx = rosterStartX + col * cellW;
    const cy = by + row * cellH;
    // Portrait
    if (cm.sprite) drawCrewSprite(cm.sprite, cx + 30, cy, 2, cm.alive, cm.injured);
    // Name
    ctx.fillStyle = !cm.alive ? PAL.danger : (cm.injured ? PAL.warning : PAL.text);
    ctx.font = '7px monospace'; ctx.textAlign = 'center';
    const shortName = cm.name.split(' ')[0];
    ctx.fillText(shortName, cx + 42, cy + 50);
    // Role
    ctx.fillStyle = PAL.textDim; ctx.font = '6px monospace';
    ctx.fillText(cm.role, cx + 42, cy + 58);
  });
}

  ctx.fillStyle = PAL.accent; ctx.font = 'bold 14px monospace'; ctx.textAlign = 'center';
  ctx.fillText('RUMORS & INTEL', W/2, panelY + 25);

  ctx.fillStyle = PAL.textDim; ctx.font = '9px monospace';
  ctx.fillText('Information gathered from station patrons. Reliability varies.', W/2, panelY + 42);

  stationRumors.forEach((r, i) => {
    const ry = panelY + 65 + i * 70;
    drawPanel(40, ry, W - 80, 58, r.reliable ? PAL.accent : PAL.warning);
    ctx.fillStyle = PAL.text; ctx.font = '11px monospace'; ctx.textAlign = 'left';
    const lines = wrapText(r.text, W - 120);
    lines.forEach((l, li) => ctx.fillText(l, 55, ry + 18 + li * 14));
    ctx.fillStyle = r.reliable ? PAL.accent : PAL.warning;
    ctx.font = '9px monospace'; ctx.textAlign = 'right';
    ctx.fillText(r.reliable ? '[SEEMS LEGIT]' : '[SOUNDS FISHY]', W - 55, ry + 48);
  });

  // Story info
  const sy = panelY + 65 + stationRumors.length * 70 + 15;
  if (storyState.rivalName) {
    ctx.fillStyle = PAL.pirate; ctx.font = '10px monospace'; ctx.textAlign = 'left';
    ctx.fillText('WANTED: ' + storyState.rivalName + ' - Last seen Sector ' + (sector + Math.floor(Math.random()*3)), 50, sy);
  }
  if (storyState.treasureName) {
    ctx.fillStyle = PAL.gold; ctx.font = '10px monospace';
    ctx.fillText('LEGEND: ' + storyState.treasureName + ' - rumored to exist', 50, sy + 16);
  }
}

function drawStationQuests(panelY) {
  ctx.fillStyle = PAL.accent; ctx.font = 'bold 14px monospace'; ctx.textAlign = 'center';
  ctx.fillText('AVAILABLE MISSIONS', W/2, panelY + 25);

  if (stationQuests.length === 0) {
    ctx.fillStyle = PAL.textDim; ctx.font = '11px monospace';
    ctx.fillText('No missions available at this station.', W/2, panelY + 80);
    return;
  }

  stationQuests.forEach((q, i) => {
    const qy = panelY + 50 + i * 90;
    drawPanel(40, qy, W - 80, 78);
    ctx.fillStyle = PAL.textBright; ctx.font = 'bold 11px monospace'; ctx.textAlign = 'left';
    ctx.fillText(q.title, 55, qy + 20);
    ctx.fillStyle = PAL.text; ctx.font = '10px monospace';
    ctx.fillText(q.desc, 55, qy + 38);
    ctx.fillStyle = PAL.gold;
    ctx.fillText('Reward: ' + q.reward + ' credits', 55, qy + 54);
    ctx.fillStyle = PAL.textDim;
    ctx.fillText('Deadline: ' + q.turnsLeft + ' legs', 300, qy + 54);

    if (!q.accepted) {
      addButton(W - 190, qy + 15, 120, 28, 'ACCEPT', () => {
        q.accepted = true;
        activeQuests.push(q);
        if (q.type === 'smuggle') {
          res.reputation += 5;
          addConsequence('contraband', q.turnsLeft, { credits: -30 }, 'Smuggled goods discovered at checkpoint!');
        }
        Audio.play('good');
        addLog('Accepted mission: ' + q.title, 'info');
      }, 'good');
    } else {
      ctx.fillStyle = PAL.accent; ctx.font = 'bold 10px monospace'; ctx.textAlign = 'right';
      ctx.fillText('[ACCEPTED]', W - 60, qy + 32);
    }
  });

  // Active quests
  if (activeQuests.length > 0) {
    const aqy = panelY + 50 + stationQuests.length * 90 + 15;
    ctx.fillStyle = PAL.accent; ctx.font = 'bold 11px monospace'; ctx.textAlign = 'left';
    ctx.fillText('ACTIVE MISSIONS:', 50, aqy);
    activeQuests.forEach((q, i) => {
      ctx.fillStyle = PAL.text; ctx.font = '10px monospace';
      ctx.fillText('- ' + q.title + ' (' + q.turnsLeft + ' legs remaining) - ' + q.reward + ' cr', 50, aqy + 16 + i * 14);
    });
  }
}

function drawStationDeals(panelY) {
  ctx.fillStyle = PAL.warning; ctx.font = 'bold 14px monospace'; ctx.textAlign = 'center';
  ctx.fillText('SHADY DEALS', W/2, panelY + 25);
  ctx.fillStyle = PAL.textDim; ctx.font = '9px monospace';
  ctx.fillText('High risk. High reward. No guarantees. No refunds.', W/2, panelY + 42);

  stationDeals.forEach((d, i) => {
    const dy = panelY + 60 + i * 100;
    drawPanel(40, dy, W - 80, 88, PAL.warning);
    ctx.fillStyle = PAL.warning; ctx.font = 'bold 11px monospace'; ctx.textAlign = 'left';
    ctx.fillText(d.title, 55, dy + 20);
    ctx.fillStyle = PAL.text; ctx.font = '10px monospace';
    ctx.fillText(d.desc, 55, dy + 38);
    ctx.fillStyle = PAL.textDim;
    ctx.fillText('Consequence arrives in ~' + d.turns + ' travel legs', 55, dy + 55);

    const canAfford = res.credits >= d.cost;
    addButton(W - 190, dy + 18, 120, 28, d.cost > 0 ? 'BUY (-' + d.cost + ' CR)' : 'ACCEPT DEAL', () => {
      if (canAfford) {
        res.credits -= d.cost;
        if (d.type === 'loan_shark') { res.credits += 150; creditsEarned += 150; }
        if (d.type === 'engine_mod') { ship.fuelEfficiency *= 0.8; }
        addConsequence(d.consequence, d.turns + Math.floor(Math.random() * 2), d.type === 'experimental_mod' ? { hull: -15, fuel: -10 } : null, d.cText);
        Audio.play('good');
        addLog('Accepted shady deal: ' + d.title, 'warning');
        // Remove from available
        stationDeals.splice(i, 1);
      } else Audio.play('bad');
    }, canAfford ? 'danger' : 'normal');
  });

  if (stationDeals.length === 0) {
    ctx.fillStyle = PAL.textDim; ctx.font = '11px monospace'; ctx.textAlign = 'center';
    ctx.fillText('No deals available. Check back next station.', W/2, panelY + 100);
  }

  // Pending consequences warning
  if (pendingConsequences.length > 0) {
    const cy = panelY + 60 + stationDeals.length * 100 + 20;
    ctx.fillStyle = PAL.danger; ctx.font = 'bold 10px monospace'; ctx.textAlign = 'left';
    ctx.fillText('PENDING CONSEQUENCES:', 50, cy);
    pendingConsequences.forEach((c, i) => {
      ctx.fillStyle = PAL.warning; ctx.font = '9px monospace';
      ctx.fillText('- ' + c.type.replace(/_/g, ' ').toUpperCase() + ' (in ~' + c.turnsLeft + ' legs)', 50, cy + 16 + i * 14);
    });
  }
}


// --- RESOURCE CONSUMPTION (with crew bonuses) ---
function consumeResources(dist) {
  const crewFactor = getAliveCrewCount() / 8;
  const cookBonus = 1 - getCrewBonus('Cook') * 0.2;
  const pilotBonus = 1 - getCrewBonus('Pilot') * 0.1;

  // Fuel consumed proportionally during travel (not upfront)
  if (travelDestination && fuelPerTick > 0) {
    res.fuel -= fuelPerTick * dist;
  } else {
    res.fuel -= dist * 0.5 * ship.fuelEfficiency * pilotBonus;
  }
  res.food -= dist * 0.3 * crewFactor * cookBonus;
  res.oxygen -= dist * 0.2 * crewFactor;
  res.morale -= dist * 0.15;

  res.fuel = Math.max(0, res.fuel);
  res.food = Math.max(0, res.food);
  res.oxygen = Math.max(0, res.oxygen);
  res.morale = Math.max(0, Math.min(100, res.morale));

  if (res.food <= 0) {
    res.morale -= 5;
    addLog('No food! Crew is starving!', 'bad');
    if (Math.random() < 0.2) killRandomCrew();
  }
  if (res.oxygen <= 0) {
    res.hull -= 2;
    addLog('Oxygen critical! Life support failing!', 'bad');
    if (Math.random() < 0.3) killRandomCrew();
  }
  if (res.fuel <= 0) {
    addLog('No fuel! Drifting...', 'bad');
    res.morale -= 3;
    res.hull -= 1;
  }

  // Quest countdown
  for (let i = activeQuests.length - 1; i >= 0; i--) {
    activeQuests[i].turnsLeft -= dist * 0.1;
    if (activeQuests[i].turnsLeft <= 0) {
      if (!activeQuests[i].completed) {
        addLog('Mission failed: ' + activeQuests[i].title, 'bad');
        res.morale -= 5;
      }
      activeQuests.splice(i, 1);
    }
  }
}

// --- DEATH CHECK ---
function checkDeath() {
  if (res.hull <= 0) {
    deathCause = 'Your ship broke apart in the void. Hull integrity reached zero.';
    die();
  } else if (getAliveCrewCount() <= 0) {
    if (res.food <= 0) deathCause = 'Your last crew member perished from starvation. The ship drifts on, empty.';
    else if (res.oxygen <= 0) deathCause = 'Your last crew member suffocated. Silence fills the corridors.';
    else deathCause = 'Your last crew member perished. The ship drifts on, a ghost vessel.';
    die();
  } else if (res.morale <= 0 && Math.random() < 0.5) {
    deathCause = 'The crew mutinied and threw you out an airlock. Fitting end for a captain who pushed too hard.';
    die();
  }
}

// --- ARRIVAL ---
function arriveAtDestination() {
  addLog('Arrived at ' + travelDestination.name + ' (Sector ' + sector + ')', 'info');

  if (leg % 5 === 0 && leg > 0) {
    sector++;
    addLog('Entered Sector ' + sector + '. Space grows more dangerous.', 'warning');
  }

  // Check quest completions at stations
  if (travelDestination.hasStation) {
    for (const q of activeQuests) {
      if (q.type === 'deliver_cargo' && q.accepted) {
        q.completed = true;
        res.credits += q.reward;
        creditsEarned += q.reward;
        addLog('Mission complete: ' + q.title + '! +' + q.reward + ' credits', 'good');
        Audio.play('good');
      }
    }
    activeQuests = activeQuests.filter(q => !q.completed);
  }

  // Planet arrival events based on type
  if (!travelDestination.hasStation && Math.random() < 0.4) {
    const pe = generatePlanetEvent(travelDestination.planetType);
    if (pe) {
      currentEvent = pe;
      eventResult = null;
      gameState = STATE.EVENT;
      addLog('Event: ' + pe.title, 'warning');
      return;
    }
  }

  if (travelDestination.hasStation) {
    enterStation();
  } else {
    generateDestinations();
    gameState = STATE.TRAVEL;
    travelProgress = 0; travelDistance = 0; travelDestination = null;
  }
}

function drawTravelAnimation(dt) {
  ctx.fillStyle = PAL.space;
  ctx.fillRect(0, 0, W, H);

  const scroll = travelProgress * 100;
  drawEnhancedBackground(scroll, true);

  // Star streak overlay during travel
  bgStars.forEach(s => {
    const speed = s.size * 3;
    const sx = (s.x - scroll * speed) % W;
    const drawX = sx < 0 ? sx + W : sx;
    ctx.globalAlpha = s.brightness * 0.5;
    ctx.fillStyle = s.color;
    ctx.fillRect(drawX, s.y, s.size + speed * 2, s.size);
  });
  ctx.globalAlpha = 1;

  drawResourcePanel();

  travelProgress += dt * 3;
  const pct = Math.min(1, travelProgress / travelDistance);

  consumeResources(dt * 3);

  const shipX = 100 + pct * (W - 300);
  drawSprite(SHIP_SPRITE, shipX - 32, H/2-24, 2);

  for (let i = 0; i < 3; i++) {
    ctx.globalAlpha = 0.3 - i * 0.1;
    ctx.fillStyle = i === 0 ? '#ff6644' : '#ffaa44';
    ctx.fillRect(shipX - 40 - i*20 - Math.random()*10, H/2-3, 15 + Math.random()*10, 6);
  }
  ctx.globalAlpha = 1;

  if (travelDestination) {
    drawPlanet(W - 80, H/2, travelDestination.planetRadius * (0.5 + pct * 0.5),
      travelDestination.planetColor1, travelDestination.planetColor2, travelDestination.hasRing);
  }

  // Progress bar
  drawPanel(100, H - 80, W - 200, 40);
  ctx.fillStyle = PAL.textDim; ctx.font = '10px monospace'; ctx.textAlign = 'left';
  ctx.fillText('TRAVELING TO: ' + (travelDestination ? travelDestination.name : '???'), 110, H-65);
  drawBar(110, H-56, W-220, 10, travelProgress, travelDistance, PAL.accent);
  ctx.fillStyle = PAL.text; ctx.textAlign = 'right';
  ctx.fillText(Math.floor(pct * 100) + '%', W-110, H-45);

  // FUEL REMAINING display
  ctx.fillStyle = res.fuel < 15 ? PAL.danger : PAL.fuel;
  ctx.font = 'bold 11px monospace'; ctx.textAlign = 'center';
  ctx.fillText('FUEL REMAINING: ' + Math.floor(res.fuel), W/2, H-90);

  // Drift event if fuel runs out
  if (res.fuel <= 0 && !travelEventTriggered) {
    travelEventTriggered = true;
    currentEvent = {
      id: 'drift', title: 'ADRIFT!', icon: 'hazard',
      text: 'Your fuel tanks are empty. The ship drifts in the cold void. Engines silent. Hope fading.',
      choices: [
        { text: 'Burn food for emergency fuel', action: 'check', stat: 'food', threshold: 20, cost: { food: -20, fuel: 10 },
          successText: 'Desperate measures. The bio-converter squeezes out enough fuel to limp to destination.',
          failText: 'Not enough food to convert.' },
        { text: 'Send distress signal', action: 'random', good: 0.5,
          successText: 'A passing freighter tows you to safety!', successEffects: { fuel: 15 },
          failText: 'No one answers. You drift for days.', failEffects: { morale: -20, food: -10, oxygen: -10 } },
        { text: 'Cannibalize ship parts', action: 'check', stat: 'parts', threshold: 3, cost: { parts: -3, fuel: 12 },
          successText: 'Your Engineer converts spare parts into makeshift fuel cells.',
          failText: 'Not enough parts.' },
      ],
    };
    eventResult = null;
    gameState = STATE.EVENT;
    addLog('OUT OF FUEL - Ship is adrift!', 'bad');
    return;
  }

  // Random event during travel
  if (!travelEventTriggered && pct > 0.3 + Math.random() * 0.3) {
    const navBonus = getCrewBonus('Navigator') * 0.05;
    if (travelDestination && Math.random() < travelDestination.eventChance - navBonus) {
      travelEventTriggered = true;
      currentEvent = pickEvent();
      eventResult = null;
      gameState = STATE.EVENT;
      addLog('Event: ' + currentEvent.title, 'warning');
      return;
    }
    travelEventTriggered = true;
  }

  // Arrival
  if (pct >= 1) {
    distance += travelDistance;
    checkDeath();
    if (gameState !== STATE.GAMEOVER && gameState !== STATE.DEATH_ANIM) {
      arriveAtDestination();
    }
  }
}

function drawEvent() {
  ctx.fillStyle = PAL.space;

  drawEnhancedBackground(distance, false);
  drawResourcePanel();

  if (!currentEvent) return;

  const pw = 550, ph = 400;
