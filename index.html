  drawPanel(px, py, pw, ph, eventResult ? (eventResult.good ? PAL.accent : PAL.danger) : PAL.panelBorder);

  const iconColors = { pirate:PAL.pirate, derelict:PAL.hull, station:PAL.accent, storm:PAL.fuel,
    hazard:PAL.warning, friendly:PAL.friendly, alien:PAL.morale, crew:PAL.morale, good:PAL.accent };
  const iconCol = iconColors[currentEvent.icon] || PAL.text;

  const iconSymbols = { pirate:'\u2620', derelict:'\u2693', station:'\u2302', storm:'\u26A1',
    hazard:'\u26A0', friendly:'\u2665', alien:'\u2604', crew:'\u263A', good:'\u2605' };
  const iconChar = iconSymbols[currentEvent.icon] || '!';

  ctx.fillStyle = iconCol; ctx.globalAlpha = 0.15;
  ctx.beginPath(); ctx.arc(px+pw/2, py+50, 30, 0, Math.PI*2); ctx.fill();
  ctx.globalAlpha = 1;
  ctx.fillStyle = iconCol; ctx.font = 'bold 22px monospace'; ctx.textAlign = 'center';
  ctx.fillText(iconChar, px+pw/2, py+57);

  ctx.fillStyle = iconCol; ctx.font = 'bold 18px monospace';
  ctx.fillText(currentEvent.title, px+pw/2, py+100);

  ctx.fillStyle = PAL.text; ctx.font = '12px monospace';
  const lines = wrapText(currentEvent.text, pw - 60);
  lines.forEach((line, i) => ctx.fillText(line, px+pw/2, py+125+i*16));

  clearButtons();

  if (eventResult) {
    const ry = py + 125 + lines.length * 16 + 20;
    ctx.fillStyle = eventResult.good ? PAL.accent : PAL.danger;
    ctx.font = 'bold 12px monospace';
    const resultLines = wrapText(eventResult.text, pw - 60);
    resultLines.forEach((line, i) => ctx.fillText(line, px+pw/2, ry+i*16));

    addButton(px+pw/2-80, py+ph-55, 160, 36, 'CONTINUE', () => {
      currentEvent = null; eventResult = null;
      checkDeath();
      if (gameState !== STATE.GAMEOVER && gameState !== STATE.DEATH_ANIM) {
        if (travelProgress < travelDistance) gameState = STATE.TRAVEL;
        else arriveAtDestination();
      }
    }, 'good');
  } else {
    const choiceY = py + 130 + lines.length * 16 + 15;
    currentEvent.choices.forEach((choice, i) => {
      addButton(px+30, choiceY + i*44, pw-60, 36, choice.text, () => resolveChoice(choice), 'normal');
    });
  }

  drawButtons(); checkButtons();
}

// --- DEATH ANIMATION STATE ---
let deathAnimTimer = 0;
let deathAnimDuration = 3.0;
let deathParticles = [];
let deathAnimPhase = 0; // 0=animating, 1=fade to black, 2=done->transition
let deathFlavorText = '';
let deathShipPieces = [];
let deathLetterIndex = 0;
let deathLetterTimer = 0;
let deathSilhouettes = [];
let deathCaptainX = 0;
let deathCaptainY = 0;
let deathAirlockOpen = 0;
let deathFlashAlpha = 0;
let deathShockwaveRadius = 0;
let deathBreathTimer = 0;
let deathVignetteRadius = 1.0;
let deathCrackLines = [];
let deathInitialized = false;

// Called when a death occurs - sets up the animation
function initDeathAnimation() {
    deathAnimTimer = 0;
    deathAnimPhase = 0;
    deathParticles = [];
    deathShipPieces = [];
    deathCrackLines = [];
    deathSilhouettes = [];
    deathLetterIndex = 0;
    deathLetterTimer = 0;
    deathCaptainX = W / 2;
    deathCaptainY = H / 2;
    deathAirlockOpen = 0;
    deathFlashAlpha = 0;
    deathShockwaveRadius = 0;
    deathBreathTimer = 0;
    deathVignetteRadius = 1.0;
    deathInitialized = true;

    switch (deathType) {
        case 'hull_breach':
            deathFlavorText = 'The hull gives way. Metal screams. The void rushes in.';
            deathAnimDuration = 3.0;
            // Pre-generate crack lines from center
            for (let i = 0; i < 8; i++) {
                let angle = (Math.PI * 2 / 8) * i + (Math.random() - 0.5) * 0.4;
                let segments = [];
                let cx = W / 2;
                let cy = H / 2;
                for (let s = 0; s < 6; s++) {
                    let len = 10 + Math.random() * 20;
                    let nx = cx + Math.cos(angle) * len;
                    let ny = cy + Math.sin(angle) * len;
                    segments.push({ x1: cx, y1: cy, x2: nx, y2: ny });
                    cx = nx;
                    cy = ny;
                    angle += (Math.random() - 0.5) * 0.6;
                }
                deathCrackLines.push({ segments: segments, revealTime: 0.3 + Math.random() * 0.5 });
            }
            // Ship pieces that drift apart
            deathShipPieces = [
                { x: 0, y: 0, vx: -30, vy: -15, rot: 0, vr: 0.5, part: 'top' },
                { x: 0, y: 0, vx: 25, vy: 20, rot: 0, vr: -0.3, part: 'bottom' },
                { x: 0, y: 0, vx: -10, vy: 5, rot: 0, vr: 0.8, part: 'mid' },
            ];
            break;

        case 'starvation':
            deathFlavorText = 'The last ration pack was three days ago. The silence on the mess deck is deafening.';
            deathAnimDuration = 3.5;
            break;

        case 'suffocation':
            deathFlavorText = 'The recyclers wheeze their last. Each breath is shallower than the one before.';
            deathAnimDuration = 3.5;
            break;

        case 'mutiny':
            deathFlavorText = "The crew's eyes are cold. 'Nothing personal, Captain.' The airlock hisses open.";
            deathAnimDuration = 3.5;
            // Create silhouette figures advancing from edges
            for (let i = 0; i < 6; i++) {
                let side = i < 3 ? -1 : 1;
                deathSilhouettes.push({
                    x: side === -1 ? -40 - i * 30 : W + 40 + (i - 3) * 30,
                    y: H / 2 - 40 + (Math.random() - 0.5) * 60,
                    targetX: W / 2 + side * (80 + i * 25),
                    w: 16 + Math.random() * 8,
                    h: 36 + Math.random() * 10,
                    speed: 60 + Math.random() * 40,
                    arrived: false,
                });
            }
            deathCaptainX = W / 2;
            deathCaptainY = H / 2;
            break;

        case 'general':
        default:
            deathFlavorText = 'In space, no one hears you explode. But they definitely see it.';
            deathAnimDuration = 3.0;
            break;
    }
}

// Main death animation draw function
function drawDeathAnimation(dt) {
    if (!deathInitialized) {
        initDeathAnimation();
    }

    deathAnimTimer += dt;
    let t = deathAnimTimer;
    let progress = Math.min(1, t / deathAnimDuration);

    // Background
    ctx.fillStyle = PAL.space;
    ctx.fillRect(0, 0, W, H);
    drawEnhancedBackground(0, false);

    switch (deathType) {
        case 'hull_breach':
            drawHullBreachDeath(dt, t, progress);
            break;
        case 'starvation':
            drawStarvationDeath(dt, t, progress);
            break;
        case 'suffocation':
            drawSuffocationDeath(dt, t, progress);
            break;
        case 'mutiny':
            drawMutinyDeath(dt, t, progress);
            break;
        case 'general':
        default:
            drawGeneralDeath(dt, t, progress);
            break;
    }

    // Update and draw particles (shared across all death types)
    for (let i = deathParticles.length - 1; i >= 0; i--) {
        let p = deathParticles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.life -= dt;
        if (p.gravity) p.vy += p.gravity * dt;
        if (p.life > 0) {
            ctx.globalAlpha = Math.max(0, Math.min(1, p.life / p.maxLife));
            ctx.fillStyle = p.color;
            let sz = p.size || 3;
            if (p.shrink) sz *= (p.life / p.maxLife);
            ctx.fillRect(p.x - sz / 2, p.y - sz / 2, sz, sz);
        } else {
            deathParticles.splice(i, 1);
        }
    }
    ctx.globalAlpha = 1;

    // Flavor text at bottom (fades in after 1 second)
    if (t > 1.0) {
        let textAlpha = Math.min(1, (t - 1.0) / 1.0);
        ctx.globalAlpha = textAlpha;
        ctx.fillStyle = PAL.textDim;
        ctx.font = '12px monospace';
        ctx.textAlign = 'center';
        let flavorLines = wrapText(deathFlavorText, 500);
        flavorLines.forEach((line, i) => {
            ctx.fillText(line, W / 2, H - 60 + i * 16);
        });
        ctx.globalAlpha = 1;
    }

    // Phase transitions
    if (deathAnimPhase === 0 && t >= deathAnimDuration) {
        deathAnimPhase = 1;
    }

    // Fade to black
    if (deathAnimPhase === 1) {
        let fadeProgress = (t - deathAnimDuration) / 0.5;
        ctx.fillStyle = 'rgba(0, 0, 0, ' + Math.min(1, fadeProgress) + ')';
        ctx.fillRect(0, 0, W, H);
        if (fadeProgress >= 1.0) {
            deathAnimPhase = 2;
            deathInitialized = false;
            gameState = STATE.GAMEOVER;
        }
    }
}

// --- HULL BREACH DEATH ---
function drawHullBreachDeath(dt, t, progress) {
    let shipX = W / 2 - 32;
    let shipY = H / 2 - 24;
    let splitPhase = Math.max(0, (t - 1.0) / 2.0); // starts splitting at t=1

    if (splitPhase <= 0) {
        // Draw intact ship with growing cracks
        drawSprite(SHIP_SPRITE, shipX, shipY, 2);

        // Draw crack lines as they reveal
        ctx.strokeStyle = '#ccddee';
        ctx.lineWidth = 2;
        for (let crack of deathCrackLines) {
            if (t >= crack.revealTime) {
                let crackProgress = Math.min(1, (t - crack.revealTime) / 0.8);
                let segsToShow = Math.floor(crackProgress * crack.segments.length);
                ctx.beginPath();
                for (let s = 0; s < segsToShow; s++) {
                    let seg = crack.segments[s];
                    ctx.moveTo(seg.x1, seg.y1);
                    ctx.lineTo(seg.x2, seg.y2);
                }
                // Partial last segment
                if (segsToShow < crack.segments.length) {
                    let frac = (crackProgress * crack.segments.length) - segsToShow;
                    let seg = crack.segments[segsToShow];
                    ctx.moveTo(seg.x1, seg.y1);
                    ctx.lineTo(
                        seg.x1 + (seg.x2 - seg.x1) * frac,
                        seg.y1 + (seg.y2 - seg.y1) * frac
                    );
                }
                ctx.stroke();
            }
        }

        // Camera shake as cracks grow
        if (t > 0.5) {
            let shakeAmt = Math.min(4, (t - 0.5) * 6);
            ctx.save();
            ctx.translate(
                (Math.random() - 0.5) * shakeAmt,
                (Math.random() - 0.5) * shakeAmt
            );
            ctx.restore();
        }
    } else {
        // Ship splitting into pieces
        for (let piece of deathShipPieces) {
            piece.x += piece.vx * dt;
            piece.y += piece.vy * dt;
            piece.rot += piece.vr * dt;

            ctx.save();
            ctx.translate(W / 2 + piece.x, H / 2 + piece.y);
            ctx.rotate(piece.rot);

            // Draw partial ship sprite based on piece part
            let clipY1 = 0, clipY2 = 48;
            if (piece.part === 'top') { clipY1 = 0; clipY2 = 16; }
            else if (piece.part === 'bottom') { clipY1 = 32; clipY2 = 48; }
            else { clipY1 = 14; clipY2 = 34; }

            SHIP_SPRITE.forEach(([color, sx, sy, sw, sh]) => {
                let py = sy * 2;
                let ph = (sh || 1) * 2;
                if (py + ph > clipY1 && py < clipY2) {
                    let drawY = Math.max(clipY1, py) - 24;
                    let drawH = Math.min(clipY2, py + ph) - Math.max(clipY1, py);
                    ctx.fillStyle = color;
                    ctx.fillRect(sx * 2 - 32, drawY, (sw || 1) * 2, drawH);
                }
            });
            ctx.restore();
        }

        // Spawn debris rectangles flying outward
        if (Math.random() < 0.5) {
            let angle = Math.random() * Math.PI * 2;
            let speed = 50 + Math.random() * 150;
            deathParticles.push({
                x: W / 2 + (Math.random() - 0.5) * 30,
                y: H / 2 + (Math.random() - 0.5) * 30,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                life: 1.5 + Math.random(),
                maxLife: 2.5,
                color: ['#556677', '#667788', '#445566', '#334455'][Math.floor(Math.random() * 4)],
                size: 3 + Math.random() * 6,
                shrink: false,
            });
        }

        // White air-venting particles streaming out
        for (let i = 0; i < 3; i++) {
            let angle = Math.random() * Math.PI * 2;
            let speed = 80 + Math.random() * 120;
            deathParticles.push({
                x: W / 2 + (Math.random() - 0.5) * 20,
                y: H / 2 + (Math.random() - 0.5) * 20,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                life: 0.6 + Math.random() * 0.6,
                maxLife: 1.2,
                color: '#ffffff',
                size: 1 + Math.random() * 2,
                shrink: true,
            });
        }
    }

    // Red warning flash overlay
    if (t < 1.5) {
        let flashAlpha = Math.sin(t * 8) * 0.15;
        if (flashAlpha > 0) {
            ctx.fillStyle = 'rgba(255, 34, 68, ' + flashAlpha + ')';
            ctx.fillRect(0, 0, W, H);
        }
    }
}

// --- STARVATION DEATH ---
function drawStarvationDeath(dt, t, progress) {
    // Draw ship centered, but dimming over time
    let dimFactor = 1.0 - progress * 0.8;
    ctx.globalAlpha = dimFactor;
    drawSprite(SHIP_SPRITE, W / 2 - 32, H / 2 - 24, 2);

    // Engine glow fading out
    let engineAlpha = Math.max(0, 1.0 - progress * 1.5);
    if (engineAlpha > 0) {
        ctx.globalAlpha = engineAlpha;
        ctx.fillStyle = '#ff6644';
        ctx.fillRect(W / 2 - 32, H / 2 - 4, -6, 8);
        ctx.fillStyle = '#ffaa44';
        ctx.fillRect(W / 2 - 38, H / 2 - 3, -4, 6);
    }
    ctx.globalAlpha = 1;

    // Increasing dark overlay (screen slowly dims)
    let dimOverlay = progress * 0.7;
    ctx.fillStyle = 'rgba(0, 0, 0, ' + dimOverlay + ')';
    ctx.fillRect(0, 0, W, H);

    // "RATIONS DEPLETED" text appearing letter by letter with stutter
    let fullText = 'RATIONS DEPLETED';
    deathLetterTimer += dt;
    let lettersPerSecond = 6;
    let targetLetters = Math.floor(deathLetterTimer * lettersPerSecond);
    deathLetterIndex = Math.min(targetLetters, fullText.length);

    if (deathLetterIndex > 0) {
        ctx.font = 'bold 28px monospace';
        ctx.textAlign = 'center';

        let displayText = fullText.substring(0, deathLetterIndex);
        let charWidth = ctx.measureText('M').width;
        let totalWidth = fullText.length * charWidth;
        let startX = W / 2 - totalWidth / 2;

        for (let i = 0; i < displayText.length; i++) {
            // Some letters randomly disappear (flicker)
            let flickerChance = progress > 0.6 ? 0.15 : 0;
            if (Math.random() > flickerChance) {
                // Slight vertical jitter on newly appearing letters
                let jitter = (i === deathLetterIndex - 1 && deathLetterTimer % (1 / lettersPerSecond) < 0.05) ? (Math.random() - 0.5) * 6 : 0;
                ctx.fillStyle = PAL.danger;
                ctx.globalAlpha = 0.7 + Math.random() * 0.3;
                ctx.fillText(displayText[i], startX + i * charWidth + charWidth / 2, H / 2 - 80 + jitter);
            }
        }
        ctx.globalAlpha = 1;
    }

    // Subtle text flicker effect across entire text
    if (t > 2.0 && Math.random() < 0.1) {
        ctx.fillStyle = 'rgba(255, 34, 68, 0.05)';
        ctx.fillRect(0, 0, W, H);
    }

    // Static/noise overlay in final phase
    if (progress > 0.7) {
        let noiseAlpha = (progress - 0.7) * 0.3;
        ctx.globalAlpha = noiseAlpha;
        for (let i = 0; i < 30; i++) {
            ctx.fillStyle = Math.random() > 0.5 ? '#222' : '#111';
            let nx = Math.random() * W;
            let ny = Math.random() * H;
            ctx.fillRect(nx, ny, Math.random() * 40 + 5, 1);
        }
        ctx.globalAlpha = 1;
    }
}

// --- SUFFOCATION DEATH ---
function drawSuffocationDeath(dt, t, progress) {
    // Draw ship
    ctx.globalAlpha = 1.0 - progress * 0.3;
    drawSprite(SHIP_SPRITE, W / 2 - 32, H / 2 - 24, 2);
    ctx.globalAlpha = 1;

    // Red pulsing overlay (sinusoidal)
    let pulseFreq = 2.0 + progress * 4.0; // speeds up over time
    let pulseAlpha = Math.sin(t * pulseFreq * Math.PI) * 0.5 + 0.5;
    pulseAlpha *= (0.1 + progress * 0.3);
    ctx.fillStyle = 'rgba(255, 0, 0, ' + Math.min(0.4, pulseAlpha) + ')';
    ctx.fillRect(0, 0, W, H);

    // Vignette effect that tightens over time
    deathVignetteRadius = Math.max(0.15, 1.0 - progress * 0.85);
    let vigGrad = ctx.createRadialGradient(
        W / 2, H / 2, W * deathVignetteRadius * 0.3,
        W / 2, H / 2, W * deathVignetteRadius
    );
    vigGrad.addColorStop(0, 'rgba(0, 0, 0, 0)');
    vigGrad.addColorStop(0.5, 'rgba(0, 0, 0, 0.3)');
    vigGrad.addColorStop(1, 'rgba(0, 0, 0, 0.95)');
    ctx.fillStyle = vigGrad;
    ctx.fillRect(0, 0, W, H);

    // "OXYGEN: 0%" blinking rapidly
    deathBreathTimer += dt;
    let blinkRate = 4 + progress * 12; // blinks faster over time
    let showText = Math.sin(deathBreathTimer * blinkRate * Math.PI) > 0;
    if (showText) {
        ctx.fillStyle = PAL.danger;
        ctx.font = 'bold 24px monospace';
        ctx.textAlign = 'center';
        ctx.globalAlpha = 0.8 + Math.sin(t * 3) * 0.2;
        ctx.fillText('OXYGEN: 0%', W / 2, H / 2 - 100);
        ctx.globalAlpha = 1;
    }

    // Breathing sound simulation via oscillating screen
    let breathAmp = Math.sin(t * 1.5 * Math.PI) * (1.0 - progress);
    if (Math.abs(breathAmp) > 0.3) {
        let breathOverlay = Math.abs(breathAmp) * 0.08;
        ctx.fillStyle = 'rgba(100, 0, 0, ' + breathOverlay + ')';
        ctx.fillRect(0, 0, W, H);
    }

    // Warning indicators flickering around the ship
    if (t > 0.5) {
        let indicators = [
            { x: W / 2 - 60, y: H / 2 - 50, label: 'LIFE SUPPORT' },
            { x: W / 2 + 20, y: H / 2 - 50, label: 'RECYCLER' },
            { x: W / 2 - 40, y: H / 2 + 40, label: 'AIR SUPPLY' },
        ];
        ctx.font = '9px monospace';
        for (let ind of indicators) {
            if (Math.random() > 0.3) {
                ctx.fillStyle = PAL.danger;
                ctx.globalAlpha = 0.4 + Math.random() * 0.4;
                ctx.textAlign = 'center';
                ctx.fillText(ind.label, ind.x, ind.y);
                // Small red dot
                ctx.beginPath();
                ctx.arc(ind.x - 35, ind.y - 3, 2, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        ctx.globalAlpha = 1;
    }

    // Screen edges darken progressively (closing in effect)
    let edgeSize = progress * 150;
    let edgeGrad;
    // Top
    edgeGrad = ctx.createLinearGradient(0, 0, 0, edgeSize);
    edgeGrad.addColorStop(0, 'rgba(0, 0, 0, 0.9)');
    edgeGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = edgeGrad;
    ctx.fillRect(0, 0, W, edgeSize);
    // Bottom
    edgeGrad = ctx.createLinearGradient(0, H, 0, H - edgeSize);
    edgeGrad.addColorStop(0, 'rgba(0, 0, 0, 0.9)');
    edgeGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = edgeGrad;
    ctx.fillRect(0, H - edgeSize, W, edgeSize);
    // Left
    edgeGrad = ctx.createLinearGradient(0, 0, edgeSize, 0);
    edgeGrad.addColorStop(0, 'rgba(0, 0, 0, 0.9)');
    edgeGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = edgeGrad;
    ctx.fillRect(0, 0, edgeSize, H);
    // Right
    edgeGrad = ctx.createLinearGradient(W, 0, W - edgeSize, 0);
    edgeGrad.addColorStop(0, 'rgba(0, 0, 0, 0.9)');
    edgeGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = edgeGrad;
    ctx.fillRect(W - edgeSize, 0, edgeSize, H);
}

// --- MUTINY DEATH ---
function drawMutinyDeath(dt, t, progress) {
    // Dark interior background (inside ship corridor)
    ctx.fillStyle = '#0a0a12';
    ctx.fillRect(0, 0, W, H);

    // Corridor walls
    ctx.fillStyle = '#151520';
    ctx.fillRect(0, H / 2 - 120, W, 240);
    ctx.strokeStyle = '#222233';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(0, H / 2 - 120);
    ctx.lineTo(W, H / 2 - 120);
    ctx.moveTo(0, H / 2 + 120);
    ctx.lineTo(W, H / 2 + 120);
    ctx.stroke();

    // Dim overhead lights
    for (let lx = 100; lx < W; lx += 150) {
        let flickerOn = Math.random() > 0.2;
        if (flickerOn) {
            ctx.fillStyle = 'rgba(80, 80, 100, 0.15)';
            ctx.beginPath();
            ctx.arc(lx, H / 2, 60, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#444460';
            ctx.fillRect(lx - 10, H / 2 - 122, 20, 4);
        }
    }

    // Airlock door on right side
    let airlockX = W - 100;
    let airlockW = 60;
    let airlockH = 100;
    let airlockY = H / 2 - airlockH / 2;

    // Airlock frame
    ctx.fillStyle = '#333344';
    ctx.fillRect(airlockX - 5, airlockY - 5, airlockW + 10, airlockH + 10);
    ctx.strokeStyle = '#555566';
    ctx.lineWidth = 2;
    ctx.strokeRect(airlockX - 5, airlockY - 5, airlockW + 10, airlockH + 10);

    // Airlock opens after t > 2.0
    if (t > 2.0) {
        deathAirlockOpen = Math.min(1, (t - 2.0) / 0.5);
    }

    if (deathAirlockOpen > 0) {
        // Stars visible through airlock
        let doorOpenWidth = airlockW * deathAirlockOpen;
        ctx.fillStyle = '#000008';
        ctx.fillRect(airlockX, airlockY, doorOpenWidth, airlockH);

        // Stars through the opening
        ctx.save();
        ctx.beginPath();
        ctx.rect(airlockX, airlockY, doorOpenWidth, airlockH);
        ctx.clip();
        for (let si = 0; si < 15; si++) {
            ctx.fillStyle = ['#ffffff', '#aaccff', '#ffccaa'][si % 3];
            ctx.globalAlpha = 0.5 + Math.random() * 0.5;
            ctx.fillRect(
                airlockX + Math.random() * airlockW,
                airlockY + Math.random() * airlockH,
                1, 1
            );
        }
        ctx.globalAlpha = 1;
        ctx.restore();

        // Door panels sliding
        let halfDoor = (airlockW - doorOpenWidth) / 2;
        if (halfDoor > 1) {
            ctx.fillStyle = '#444455';
            ctx.fillRect(airlockX - halfDoor, airlockY, halfDoor, airlockH);
            ctx.fillRect(airlockX + doorOpenWidth, airlockY, halfDoor, airlockH);
        }
    } else {
        // Closed airlock door
        ctx.fillStyle = '#444455';
        ctx.fillRect(airlockX, airlockY, airlockW, airlockH);
        ctx.strokeStyle = '#555566';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(airlockX + airlockW / 2, airlockY);
        ctx.lineTo(airlockX + airlockW / 2, airlockY + airlockH);
        ctx.stroke();
        // Airlock warning stripe
        ctx.fillStyle = '#aa4400';
        ctx.fillRect(airlockX, airlockY - 8, airlockW, 4);
        ctx.fillRect(airlockX, airlockY + airlockH + 4, airlockW, 4);
    }

    // Silhouette figures advancing
    for (let sil of deathSilhouettes) {
        if (!sil.arrived) {
            let dx = sil.targetX - sil.x;
            if (Math.abs(dx) > 2) {
                sil.x += Math.sign(dx) * sil.speed * dt;
            } else {
                sil.arrived = true;
            }
        }

        // Draw silhouette figure (simple dark shape)
        ctx.fillStyle = '#0a0a14';
        // Body
        ctx.fillRect(sil.x - sil.w / 2, sil.y - sil.h / 2, sil.w, sil.h);
        // Head
        ctx.beginPath();
        ctx.arc(sil.x, sil.y - sil.h / 2 - 6, 7, 0, Math.PI * 2);
        ctx.fill();
        // Menacing eyes (small red dots)
        if (t > 1.0) {
            ctx.fillStyle = '#ff2244';
            ctx.globalAlpha = 0.6 + Math.sin(t * 5 + sil.x) * 0.3;
            ctx.fillRect(sil.x - 3, sil.y - sil.h / 2 - 8, 2, 2);
            ctx.fillRect(sil.x + 2, sil.y - sil.h / 2 - 8, 2, 2);
            ctx.globalAlpha = 1;
        }
    }

    // Captain figure being pushed toward airlock
    if (t < 2.0) {
        // Captain standing, then being pushed
        let pushProgress = Math.max(0, (t - 1.2) / 0.8);
        deathCaptainX = W / 2 + pushProgress * (airlockX - W / 2 - 10);
    } else if (t < 2.5 && deathAirlockOpen > 0.5) {
        // Captain being pushed through airlock
        let ejectProgress = (t - 2.0) / 0.5;
        deathCaptainX = airlockX + ejectProgress * 200;
    } else if (t >= 2.5) {
        deathCaptainX = airlockX + 300; // off screen
    }

    // Draw captain figure (distinguishable from crew)
    if (deathCaptainX < W + 50) {
        // Captain body (slightly different color to distinguish)
        ctx.fillStyle = '#334455';
        ctx.fillRect(deathCaptainX - 8, H / 2 - 18, 16, 36);
        // Captain head
        ctx.beginPath();
        ctx.arc(deathCaptainX, H / 2 - 24, 8, 0, Math.PI * 2);
        ctx.fill();
        // Captain hat (small rectangle on top)
        ctx.fillStyle = '#445566';
        ctx.fillRect(deathCaptainX - 10, H / 2 - 34, 20, 5);
        // Captain struggling arms
        if (t > 1.2 && t < 2.5) {
            let armWave = Math.sin(t * 12) * 8;
            ctx.fillStyle = '#334455';
            ctx.fillRect(deathCaptainX - 14, H / 2 - 12 + armWave, 6, 3);
            ctx.fillRect(deathCaptainX + 8, H / 2 - 12 - armWave, 6, 3);
        }
    }

    // After ejection, captain tumbles into space
    if (t >= 2.5 && deathCaptainX < W + 50) {
        // Small spinning figure flying away
        for (let i = 0; i < 2; i++) {
            deathParticles.push({
                x: Math.min(deathCaptainX, W - 50),
                y: H / 2 + (Math.random() - 0.5) * 10,
                vx: 100 + Math.random() * 50,
                vy: (Math.random() - 0.5) * 80,
                life: 1.0,
                maxLife: 1.0,
                color: '#334455',
                size: 2,
                shrink: false,
            });
        }
    }

    // Dim red emergency lighting
    ctx.fillStyle = 'rgba(80, 0, 0, ' + (0.05 + Math.sin(t * 2) * 0.03) + ')';
    ctx.fillRect(0, 0, W, H);
}

// --- GENERAL DEATH (EXPLOSION) ---
function drawGeneralDeath(dt, t, progress) {
    let shipX = W / 2 - 32;
    let shipY = H / 2 - 24;

    // Phase 1: Ship visible, white flash builds
    if (t < 0.5) {
        drawSprite(SHIP_SPRITE, shipX, shipY, 2);

        // Engine sputtering
        if (Math.random() > 0.4) {
            ctx.fillStyle = '#ff6644';
            ctx.fillRect(shipX, H / 2 - 3, -4 - Math.random() * 6, 6);
        }

        // Build-up glow at center
        let buildUp = t / 0.5;
        ctx.globalAlpha = buildUp * 0.3;
        let grad = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, 50 * buildUp);
        grad.addColorStop(0, '#ffffff');
        grad.addColorStop(0.5, '#ffaa44');
        grad.addColorStop(1, 'rgba(255, 100, 0, 0)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(W / 2, H / 2, 50 * buildUp, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
    }

    // Phase 2: White flash
    if (t >= 0.5 && t < 0.7) {
        deathFlashAlpha = 1.0 - ((t - 0.5) / 0.2);
        ctx.fillStyle = 'rgba(255, 255, 255, ' + deathFlashAlpha + ')';
        ctx.fillRect(0, 0, W, H);
    }

    // Phase 3: Explosion and shockwave
    if (t >= 0.5) {
        let explodeT = t - 0.5;

        // Central explosion glow (fading)
        let glowRadius = 30 + explodeT * 80;
        let glowAlpha = Math.max(0, 0.8 - explodeT * 0.4);
        if (glowAlpha > 0) {
            ctx.globalAlpha = glowAlpha;
            let grad = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, glowRadius);
            grad.addColorStop(0, '#ffcc44');
            grad.addColorStop(0.3, '#ff6622');
            grad.addColorStop(0.6, '#cc2200');
            grad.addColorStop(1, 'rgba(100, 0, 0, 0)');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(W / 2, H / 2, glowRadius, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1;
        }

        // Shockwave ring expanding
        deathShockwaveRadius = explodeT * 250;
        if (deathShockwaveRadius < W) {
            let ringAlpha = Math.max(0, 0.7 - explodeT * 0.3);
            ctx.strokeStyle = 'rgba(255, 200, 100, ' + ringAlpha + ')';
            ctx.lineWidth = Math.max(1, 4 - explodeT * 2);
            ctx.beginPath();
            ctx.arc(W / 2, H / 2, deathShockwaveRadius, 0, Math.PI * 2);
            ctx.stroke();

            // Inner ring
            if (deathShockwaveRadius > 20) {
                ctx.strokeStyle = 'rgba(255, 255, 200, ' + (ringAlpha * 0.5) + ')';
                ctx.lineWidth = Math.max(1, 2 - explodeT);
                ctx.beginPath();
                ctx.arc(W / 2, H / 2, deathShockwaveRadius * 0.7, 0, Math.PI * 2);
                ctx.stroke();
            }
        }

        // Spawn explosion particles (heavy burst at start, then trailing)
        let spawnRate = explodeT < 0.3 ? 8 : (explodeT < 1.0 ? 2 : 0);
        for (let i = 0; i < spawnRate; i++) {
            let angle = Math.random() * Math.PI * 2;
            let speed = 50 + Math.random() * 300;
            let colors = ['#ffcc44', '#ff8822', '#ff4411', '#cc2200', '#ffffff', '#ffaa00'];
            deathParticles.push({
                x: W / 2 + (Math.random() - 0.5) * 20,
                y: H / 2 + (Math.random() - 0.5) * 20,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                life: 0.5 + Math.random() * 1.5,
                maxLife: 2.0,
                color: colors[Math.floor(Math.random() * colors.length)],
                size: 2 + Math.random() * 5,
                shrink: true,
            });
        }

        // Debris chunks (larger, slower)
        if (explodeT < 0.5 && Math.random() < 0.4) {
            let angle = Math.random() * Math.PI * 2;
            let speed = 30 + Math.random() * 100;
            deathParticles.push({
                x: W / 2,
                y: H / 2,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                life: 2.0 + Math.random(),
                maxLife: 3.0,
                color: ['#556677', '#445566', '#667788', '#334455'][Math.floor(Math.random() * 4)],
                size: 4 + Math.random() * 8,
                shrink: false,
                gravity: 5,
            });
        }
    }

    // Residual white flash at the very start of explosion
    if (t >= 0.5 && t < 0.6) {
        let flashA = (0.6 - t) / 0.1 * 0.4;
        ctx.fillStyle = 'rgba(255, 255, 255, ' + flashA + ')';
        ctx.fillRect(0, 0, W, H);
    }
}


// --- MENU SCREEN (EXPANDED) ---
let menuShipX = -80;
let menuShipY = 0;
let menuTaglineIndex = 0;
let menuTaglineTimer = 0;
const MENU_TAGLINES = [
    'Now with 100% more rubber ducks',
    'Space IRS approved*  (*not actually approved)',
    'Your crew will hate you',
    'Contains sentient toilets',
    'Rated M for Mutiny',
    'Now with actual consequences',
    'Where no pirate has drifted before',
    'Hull integrity is just a suggestion',
    'The void stares back',
    'All toilets are final',
];

function drawMenuScreen() {
    ctx.fillStyle = PAL.space;
    ctx.fillRect(0, 0, W, H);
    drawEnhancedBackground(gameTime * 5, false);

    // Animated ship flying across background (behind title)
    menuShipX += 60 * (1 / 60);
    menuShipY = H * 0.78 + Math.sin(gameTime * 1.2) * 12;
    if (menuShipX > W + 100) {
        menuShipX = -80;
    }
    ctx.globalAlpha = 0.4;
    drawSprite(SHIP_SPRITE, menuShipX, menuShipY, 1.2);
    ctx.fillStyle = '#ff6644';
    ctx.globalAlpha = 0.25;
    ctx.fillRect(menuShipX - 8, menuShipY + 8, -12 - Math.random() * 8, 3);
    ctx.fillStyle = '#ffaa44';
    ctx.globalAlpha = 0.15;
    ctx.fillRect(menuShipX - 20, menuShipY + 9, -8 - Math.random() * 6, 2);
    ctx.globalAlpha = 1;

    // Title with glow
    ctx.save();
    ctx.shadowColor = PAL.accent;
    ctx.shadowBlur = 30;
    ctx.fillStyle = PAL.accent;
    ctx.font = 'bold 42px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('VOID', W / 2, 130);
    ctx.fillText('VOID', W / 2, 130);
    ctx.shadowColor = PAL.warning;
    ctx.fillStyle = PAL.warning;
    ctx.fillText('DRIFTER', W / 2, 180);
    ctx.fillText('DRIFTER', W / 2, 180);
    ctx.restore();

    // Subtitle
    ctx.fillStyle = PAL.textDim;
    ctx.font = '12px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('A SPACE PIRATE SURVIVAL GAME', W / 2, 210);

    // Static ship display in center
    drawSprite(SHIP_SPRITE, W / 2 - 32, 228, 2);

    // Rotating tagline
    menuTaglineTimer += 1 / 60;
    if (menuTaglineTimer > 3.5) {
        menuTaglineTimer = 0;
        menuTaglineIndex = (menuTaglineIndex + 1) % MENU_TAGLINES.length;
    }
    let tagFade = 1;
    if (menuTaglineTimer < 0.3) tagFade = menuTaglineTimer / 0.3;
    if (menuTaglineTimer > 3.0) tagFade = (3.5 - menuTaglineTimer) / 0.5;
    ctx.globalAlpha = Math.max(0, tagFade) * 0.7;
    ctx.fillStyle = PAL.accent;
    ctx.font = '11px monospace';
    ctx.fillText('"' + MENU_TAGLINES[menuTaglineIndex] + '"', W / 2, 280);
    ctx.globalAlpha = 1;

    clearButtons();
    addButton(W / 2 - 100, 310, 200, 40, 'BEGIN VOYAGE', function() {
        Audio.init();
        startNewGame();
    }, 'good');

    if (highScores.length > 0) {
        addButton(W / 2 - 100, 365, 200, 36, 'HIGH SCORES', function() {
            Audio.init();
            gameState = 'scores';
        }, 'normal');
    }

    // Flavor text at bottom
    ctx.fillStyle = PAL.textDim;
    ctx.font = '9px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('SURVIVE THE ENDLESS VOID. THERE IS NO DESTINATION.', W / 2, H - 50);
    ctx.fillText('MANAGE YOUR CREW, RAID SHIPS, TRADE, AND ENDURE.', W / 2, H - 35);

    // Version text
    ctx.fillStyle = PAL.textDim;
    ctx.globalAlpha = 0.4;
    ctx.font = '8px monospace';
    ctx.fillText('v2.0', W / 2, H - 15);
    ctx.globalAlpha = 1;

    drawButtons();
    checkButtons();
}

// --- SCORES SCREEN ---
function drawScoresScreen() {
    ctx.fillStyle = PAL.space;
    ctx.fillRect(0, 0, W, H);
    drawEnhancedBackground(0, false);

    ctx.fillStyle = PAL.accent;
    ctx.font = 'bold 20px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('HIGH SCORES', W / 2, 60);

    if (highScores.length === 0) {
        ctx.fillStyle = PAL.textDim;
        ctx.font = '12px monospace';
        ctx.fillText('No scores yet. The void awaits your first voyage.', W / 2, 150);
    } else {
        ctx.font = '10px monospace';
        ctx.textAlign = 'left';
        ctx.fillStyle = PAL.textDim;
        ctx.fillText('RANK', 120, 100);
        ctx.fillText('DISTANCE', 200, 100);
        ctx.fillText('SECTOR', 340, 100);
        ctx.fillText('PIRATES', 430, 100);
        ctx.fillText('CREDITS', 530, 100);
        ctx.fillText('CREW LOST', 630, 100);

        // Separator line
        ctx.strokeStyle = PAL.panelBorder;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(120, 108);
        ctx.lineTo(720, 108);
        ctx.stroke();

        for (let i = 0; i < highScores.length; i++) {
            let s = highScores[i];
            let y = 128 + i * 30;

            // Highlight bar for top 3
            if (i < 3) {
                ctx.fillStyle = 'rgba(0, 255, 204, ' + (0.03 - i * 0.008) + ')';
                ctx.fillRect(110, y - 14, 620, 26);
            }

            ctx.fillStyle = i === 0 ? PAL.gold : (i < 3 ? PAL.accent : PAL.text);
            ctx.font = i === 0 ? 'bold 12px monospace' : '11px monospace';
            ctx.textAlign = 'left';
            ctx.fillText('#' + (i + 1), 120, y);
            ctx.fillText(Math.floor(s.distance) + ' pc', 200, y);
            ctx.fillText(String(s.sector), 340, y);
            ctx.fillText(String(s.piratesDefeated || 0), 430, y);
            ctx.fillText(String(s.credits || 0), 530, y);
            ctx.fillText(String(s.crewLost || 0), 630, y);
        }
    }

    clearButtons();
    addButton(W / 2 - 80, H - 80, 160, 36, 'BACK', function() {
        gameState = STATE.MENU;
    }, 'normal');
    drawButtons();
    checkButtons();
}

// --- GAME OVER SCREEN (EXPANDED) ---
function drawGameOverScreen() {
    ctx.fillStyle = PAL.space;
    ctx.fillRect(0, 0, W, H);
    drawEnhancedBackground(0, false);

    drawPanel(W / 2 - 280, 30, 560, 530);

    // Title
    ctx.fillStyle = PAL.danger;
    ctx.font = 'bold 28px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('VOYAGE ENDED', W / 2, 72);

    // Death cause
    ctx.fillStyle = PAL.text;
    ctx.font = '11px monospace';
    let causeLines = wrapText(deathCause, 480);
    causeLines.forEach(function(line, i) {
        ctx.fillText(line, W / 2, 98 + i * 15);
    });

    let statY = 98 + causeLines.length * 15 + 15;

    // Voyage statistics header
    ctx.fillStyle = PAL.accent;
    ctx.font = 'bold 13px monospace';
    ctx.fillText('VOYAGE STATISTICS', W / 2, statY);

    let stats = [
        ['Distance Traveled', Math.floor(distance) + ' parsecs'],
        ['Sectors Explored', String(sector)],
        ['Pirates Defeated', String(piratesDefeated)],
        ['Ships Raided', String(shipsRaided)],
        ['Crew Lost', String(crewLost)],
        ['Credits Earned', String(creditsEarned)],
        ['Final Crew Size', String(res.crew)],
    ];

    ctx.font = '11px monospace';
    stats.forEach(function(item, i) {
        let sy = statY + 18 + i * 19;
        ctx.fillStyle = PAL.textDim;
        ctx.textAlign = 'left';
        ctx.fillText(item[0], W / 2 - 200, sy);
        ctx.fillStyle = PAL.text;
        ctx.textAlign = 'right';
        ctx.fillText(item[1], W / 2 + 200, sy);
    });

    let rosterY = statY + 18 + stats.length * 19 + 12;

    // Crew roster at death — sprite grid
    if (typeof crewMembers !== 'undefined' && crewMembers.length > 0) {
        ctx.fillStyle = PAL.morale;
        ctx.font = 'bold 11px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('CREW ROSTER', W / 2, rosterY);

        const rPerRow = 8;
        const rCellW = 56;
        const rStartX = W / 2 - (Math.min(crewMembers.length, rPerRow) * rCellW) / 2;
        for (let i = 0; i < crewMembers.length; i++) {
            let cm = crewMembers[i];
            let col = i % rPerRow;
            let row = Math.floor(i / rPerRow);
            let rx = rStartX + col * rCellW;
            let ry = rosterY + 10 + row * 62;
            if (cm.sprite) drawCrewSprite(cm.sprite, rx + 16, ry, 2, cm.alive, cm.injured);
            ctx.fillStyle = cm.alive ? PAL.text : PAL.danger;
            ctx.font = '6px monospace'; ctx.textAlign = 'center';
            ctx.fillText(cm.name.split(' ')[0], rx + 28, ry + 50);
            ctx.fillStyle = PAL.textDim;
            ctx.fillText(cm.role, rx + 28, ry + 57);
        }
        rosterY += 10 + (Math.ceil(crewMembers.length / rPerRow)) * 62 + 4;
    } else {
        rosterY += 5;
    }

    // Achievements section
    let achievements = [];

    // Check log for specific events to determine achievements
    let hadRubberDucks = false;
    let hadSpaceIRS = false;
    let hadSentientToilet = false;
    let hadAlienProbe = false;
    let hadMutinyEvent = false;
    let hadBountyHunter = false;
    let survivedIonStorm = false;
    let noCrewLost = (crewLost === 0);

    for (let i = 0; i < log.length; i++) {
        let msg = log[i].msg.toLowerCase();
        if (msg.indexOf('rubber duck') !== -1 || msg.indexOf('rubber ducks') !== -1) hadRubberDucks = true;
        if (msg.indexOf('space irs') !== -1 || msg.indexOf('tax') !== -1) hadSpaceIRS = true;
        if (msg.indexOf('sentient toilet') !== -1 || msg.indexOf('toilet') !== -1) hadSentientToilet = true;
        if (msg.indexOf('alien probe') !== -1) hadAlienProbe = true;
        if (msg.indexOf('mutiny') !== -1) hadMutinyEvent = true;
        if (msg.indexOf('bounty hunter') !== -1) hadBountyHunter = true;
        if (msg.indexOf('ion storm') !== -1) survivedIonStorm = true;
    }

    if (hadRubberDucks) achievements.push({ name: 'Duck Commander', desc: 'Encountered the rubber duck phenomenon' });
    if (hadSpaceIRS) achievements.push({ name: 'Tax Evader', desc: 'Tangled with the Space IRS' });
    if (hadSentientToilet) achievements.push({ name: 'Toilet Whisperer', desc: 'Met a sentient toilet' });
    if (hadAlienProbe) achievements.push({ name: 'First Contact', desc: 'Interacted with an alien probe' });
    if (hadMutinyEvent) achievements.push({ name: 'Mutiny Survivor', desc: 'Faced a crew mutiny' });
    if (hadBountyHunter) achievements.push({ name: 'Most Wanted', desc: 'Attracted a bounty hunter' });
    if (survivedIonStorm) achievements.push({ name: 'Storm Rider', desc: 'Survived an ion storm' });
    if (noCrewLost && distance > 50) achievements.push({ name: 'Benevolent Captain', desc: 'Lost no crew members' });
    if (piratesDefeated >= 5) achievements.push({ name: 'Scourge of Pirates', desc: 'Defeated 5+ pirates' });
    if (piratesDefeated >= 10) achievements.push({ name: 'Pirate Slayer', desc: 'Defeated 10+ pirates' });
    if (distance >= 100) achievements.push({ name: 'Deep Drifter', desc: 'Traveled 100+ parsecs' });
    if (distance >= 200) achievements.push({ name: 'Void Veteran', desc: 'Traveled 200+ parsecs' });
    if (sector >= 5) achievements.push({ name: 'Sector Hopper', desc: 'Reached Sector 5' });
    if (creditsEarned >= 500) achievements.push({ name: 'Profiteer', desc: 'Earned 500+ credits' });
    if (creditsEarned >= 1000) achievements.push({ name: 'Space Tycoon', desc: 'Earned 1000+ credits' });
    if (shipsRaided >= 3) achievements.push({ name: 'Corsair', desc: 'Raided 3+ ships' });

    if (achievements.length > 0) {
        ctx.fillStyle = PAL.gold;
        ctx.font = 'bold 11px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('ACHIEVEMENTS UNLOCKED', W / 2, rosterY);

        ctx.font = '9px monospace';
        // Show up to 6 achievements in 2 columns
        let maxShow = Math.min(achievements.length, 6);
        let achHalf = Math.ceil(maxShow / 2);
        for (let i = 0; i < maxShow; i++) {
            let ach = achievements[i];
            let colX = i < achHalf ? W / 2 - 220 : W / 2 + 20;
            let row = i < achHalf ? i : i - achHalf;
            let ay = rosterY + 14 + row * 14;

            ctx.textAlign = 'left';
            ctx.fillStyle = PAL.gold;
            ctx.fillText('*', colX, ay);
            ctx.fillStyle = PAL.textBright;
            ctx.fillText(ach.name, colX + 10, ay);
            ctx.fillStyle = PAL.textDim;
            ctx.fillText('- ' + ach.desc, colX + 10 + ctx.measureText(ach.name + ' ').width, ay);
        }
        if (achievements.length > 6) {
            ctx.fillStyle = PAL.textDim;
            ctx.textAlign = 'center';
            ctx.fillText('...and ' + (achievements.length - 6) + ' more', W / 2, rosterY + 14 + achHalf * 14 + 5);
        }
    }

    // High score check
    if (highScores.length > 0 && highScores[0].distance === distance) {
        ctx.fillStyle = PAL.gold;
        ctx.font = 'bold 14px monospace';
        ctx.textAlign = 'center';
        let hsY = Math.min(rosterY + 90, 510);
        ctx.fillText('NEW BEST DISTANCE!', W / 2, hsY);

        // Sparkle effect around the text
        ctx.globalAlpha = 0.5 + Math.sin(gameTime * 5) * 0.3;
        ctx.fillStyle = PAL.gold;
        let sparkleX = W / 2 - 120 + Math.sin(gameTime * 3) * 100;
        ctx.fillRect(sparkleX, hsY - 10, 3, 3);
        sparkleX = W / 2 + 120 + Math.cos(gameTime * 2.5) * 80;
        ctx.fillRect(sparkleX, hsY - 8, 2, 2);
        ctx.globalAlpha = 1;
    }

    clearButtons();
    addButton(W / 2 - 100, 530, 200, 36, 'TRY AGAIN', function() {
        Audio.init();
        startNewGame();
    }, 'good');
    drawButtons();
    checkButtons();
}

function die() {
    // Determine death type based on what killed the player
    if (res.hull <= 0) {
        deathType = 'hull_breach';
    } else if (res.food <= 0 && res.crew <= 0) {
        deathType = 'starvation';
    } else if (res.oxygen <= 0 && res.crew <= 0) {
        deathType = 'suffocation';
    } else if (res.morale <= 0) {
        deathType = 'mutiny';
    } else if (deathCause.toLowerCase().indexOf('hull') !== -1 || deathCause.toLowerCase().indexOf('broke apart') !== -1) {
        deathType = 'hull_breach';
    } else if (deathCause.toLowerCase().indexOf('starv') !== -1 || deathCause.toLowerCase().indexOf('food') !== -1) {
        deathType = 'starvation';
    } else if (deathCause.toLowerCase().indexOf('oxygen') !== -1 || deathCause.toLowerCase().indexOf('suffoc') !== -1 || deathCause.toLowerCase().indexOf('air') !== -1) {
        deathType = 'suffocation';
    } else if (deathCause.toLowerCase().indexOf('mutin') !== -1 || deathCause.toLowerCase().indexOf('airlock') !== -1) {
        deathType = 'mutiny';
    } else {
        deathType = 'general';
    }

    // Mark dead crew members
    if (typeof crewMembers !== 'undefined') {
        let aliveCount = res.crew;
        for (let i = 0; i < crewMembers.length; i++) {
            if (i < aliveCount) {
                crewMembers[i].alive = true;
            } else {
                crewMembers[i].alive = false;
            }
        }
    }

    deathInitialized = false;
    gameState = STATE.DEATH_ANIM;
    Audio.play('death');
    saveScore();
}

// --- UPDATED saveScore() ---
function saveScore() {
    highScores.push({
        distance: distance,
        sector: sector,
        piratesDefeated: piratesDefeated,
        credits: creditsEarned,
        crewLost: crewLost,
        shipsRaided: shipsRaided,
        deathType: deathType,
        date: Date.now(),
    });
    highScores.sort(function(a, b) { return b.distance - a.distance; });
    highScores = highScores.slice(0, 10);
    try {
        localStorage.setItem('voidDrifterScores', JSON.stringify(highScores));
    } catch (e) {
        // Storage full or unavailable, silently fail
    }
}

// --- NEW GAME INITIALIZATION (EXPANDED) ---
function startNewGame() {
    // Reset resources
    res.fuel = 80;
    res.food = 80;
    res.hull = 100;
    res.morale = 70;
    res.credits = 200;
    res.ammo = 30;
    res.parts = 10;
    res.reputation = 50;
    res.oxygen = 100;
    res.crew = 8;

    // Reset ship
    ship.hullMax = 100;
    ship.fuelEfficiency = 1.0;
    ship.weaponPower = 1;
    ship.shieldStrength = 0;
    ship.cargoCapacity = 1.0;

    // Reset journey
    distance = 0;
    sector = 1;
    leg = 0;
    piratesDefeated = 0;
    shipsRaided = 0;
    crewLost = 0;
    creditsEarned = 0;
    deathCause = '';
    deathType = 'general';

    // Reset log
    log.length = 0;

    // Reset travel state
    travelProgress = 0;
    travelDistance = 0;
    travelDestination = null;
    travelEventTriggered = false;
    currentEvent = null;
    eventResult = null;
    stationData = null;
    combat = null;

    // Generate crew
    generateCrew(8);
    res.crew = crewMembers.length;

    // Initialize story state
    initStoryState();

    // Clear pending consequences and active quests
    pendingConsequences = [];
    activeQuests = [];

    // Reset death animation state
    deathAnimTimer = 0;
    deathAnimPhase = 0;
    deathParticles = [];
    deathInitialized = false;

    // Reset menu animation
    menuShipX = -80;

    // Add opening log messages
    addLog('Voyage begins. The void awaits.', 'info');
    addLog('Crew of ' + crewMembers.length + ' reporting for duty.', 'info');

    let crewRoles = {};
    for (let i = 0; i < crewMembers.length; i++) {
        let r = crewMembers[i].role;
        crewRoles[r] = (crewRoles[r] || 0) + 1;
    }
    let roleList = [];
    for (let role in crewRoles) {
        if (crewRoles.hasOwnProperty(role)) {
            roleList.push(crewRoles[role] + ' ' + role + (crewRoles[role] > 1 ? 's' : ''));
        }
    }
    addLog('Crew: ' + roleList.join(', '), 'info');

    // Generate first set of destinations
    generateDestinations();

    // Set game state
    gameState = STATE.TRAVEL;
}

// --- MAIN GAME LOOP ---
let lastTime = 0;
let lastAmbienceTime = 0;

function gameLoop(time) {
    requestAnimationFrame(gameLoop);

    let dt = Math.min(0.05, (time - lastTime) / 1000);
    lastTime = time;
    gameTime += dt;

    // Update animated background elements (comets, etc.)
    updateEnhancedBackground(dt);

    // Ambient sound timing
    if (Audio.initialized && gameTime - lastAmbienceTime > 4 && gameState !== STATE.MENU && gameState !== STATE.DEATH_ANIM) {
        Audio.ambience(sector * 0.2);
        lastAmbienceTime = gameTime;
    }

    try {
        switch (gameState) {
            case STATE.MENU:
                drawMenuScreen();
                break;

            case 'scores':
                drawScoresScreen();
                break;

            case STATE.TRAVEL:
                if (travelDestination && travelProgress < travelDistance) {
                    drawTravelAnimation(dt);
                } else {
                    drawTravelChoices();
                }
                break;

            case STATE.EVENT:
                drawEvent();
                break;

            case STATE.STATION:
                drawStation();
                break;

            case STATE.COMBAT:
                updateCombat(dt);
                drawCombat();
                break;

            case STATE.LOG:
                drawLog();
                break;

            case STATE.DEATH_ANIM:
                drawDeathAnimation(dt);
                break;

            case STATE.GAMEOVER:
                drawGameOverScreen();
                break;

            default:
                // Unknown state, reset to menu
                drawMenuScreen();
                break;
        }
    } catch (err) {
        console.error('Game error:', err);
        ctx.fillStyle = PAL.danger;
        ctx.font = '14px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('Error: ' + err.message, W / 2, H / 2);
        ctx.fillStyle = PAL.textDim;
        ctx.font = '10px monospace';
        ctx.fillText('Press any key or click to return to menu', W / 2, H / 2 + 25);
        if (mouse.clicked) {
            gameState = STATE.MENU;
        }
    }

    mouse.clicked = false;
}

requestAnimationFrame(gameLoop);
</script>
